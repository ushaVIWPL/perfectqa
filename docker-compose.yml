version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfectqa_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Djava.awt.headless=true
    volumes:
      # Persist uploaded files (logos, screenshots) across container restarts
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped
