<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Test Case Transaction</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Add Test Case Transaction</h2>

    <!-- Display error if testCaseNo already exists -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

 <form th:action="@{/save}" th:object="${transaction}" 
          method="post" enctype="multipart/form-data" class="row g-3">
        <!-- MainKey = combinedKey (readonly) -->
        <div class="col-md-6">
            <label class="form-label">Main Key:</label>
            <input type="text" th:field="*{mainKey}" class="form-control" readonly />
        </div>

        <div class="col-md-6">
            <label class="form-label">Test Case  Transaction No:</label>
            <input type="text" th:field="*{testCaseNo}" class="form-control" required />
        </div>

     <!--   <div class="col-md-4">
            <label class="form-label">Serial No:</label>
            <input type="number" th:field="*{serialNo}" class="form-control" />
        </div>
-->
        <div class="col-md-4">
            <label class="form-label">Type:</label>
            <input type="text" th:field="*{type}" class="form-control" />
        </div>

        <div class="col-md-4">
            <label class="form-label">Action:</label>
            <input type="text" th:field="*{action}" class="form-control" />
        </div>

        <div class="col-md-12">
            <label class="form-label">URL:</label>
            <input type="text" th:field="*{url}" class="form-control" />
        </div>

        <div class="col-md-6">
            <label class="form-label">Expected Results:</label>
            <textarea th:field="*{expectedResults}" class="form-control"></textarea>
        </div>

        <div class="col-md-6">
            <label class="form-label">Actual Results:</label>
            <textarea th:field="*{actualResults}" class="form-control"></textarea>
        </div>

        <div class="col-md-4">
            <label class="form-label">Tested Date:</label>
            <input type="date" th:field="*{testedDate}" class="form-control" />
        </div>

       <div class="col-md-4">
    <label class="form-label">Pass/Fail:</label>
    <select th:field="*{passFail}" class="form-control">
        <option value="">-- Select --</option>
        <option value="Pass">Pass</option>
        <option value="Fail">Fail</option>
    <option value="Hold">Hold</option>

    </select>
</div>


        <div class="col-md-4">
            <label class="form-label">Defects:</label>
            <input type="text" th:field="*{defects}" class="form-control" />
        </div>

        <div class="col-md-12">
            <label class="form-label">Comments:</label>
            <textarea th:field="*{comments}" class="form-control"></textarea>
        </div>

<!-- Display existing screenshots -->
<!-- Display existing screenshots -->
<div class="mb-3">
    <label class="form-label fw-bold">Uploaded Screenshots</label>
    <div class="d-flex flex-wrap gap-2">
        <div th:each="img : ${base64Screenshots}" class="position-relative">
            <img th:src="${img}" alt="screenshot"
                 class="rounded shadow-sm"
                 style="width:120px; height:120px; object-fit:cover; border:2px solid #ccc;" />
            <a th:href="${img}" download="screenshot.png"
               class="btn btn-sm btn-light position-absolute top-0 end-0 m-1">
                ⬇
            </a>
        </div>
    </div>
</div>



<!-- Upload new screenshots -->
<div class="col-md-12">
    <label class="form-label">Upload Screenshots:</label>
    <input type="file" name="uploadedScreenshots" multiple class="form-control" />
    <small class="text-muted">You can select more than one file</small>
</div>

        
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save Transaction</button>
            
    <a href="/getall" class="btn btn-primary me-2">List Transaction</a>



<div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
</div>

        </div>
    </form>
</div>
</body>
</html>
