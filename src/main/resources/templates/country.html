<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Country List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="p-4">

<h2 class="mb-4">Countries List</h2>

<table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-light">
    <tr>
        <th>Country Code</th>
        <th>Country Name</th>
        <th>Numeric Code</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${countries}">
        <td th:text="${c.countryCode}"></td>
        <td th:text="${c.countryName}"></td>
        <td th:text="${c.numericCode}"></td>
        <td>
            <button type="button" class="btn btn-primary"
                    onclick="openEditModal('${c.countryCode}')">Edit</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Country</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="countryCode">
                <div class="mb-2">
                    <label>Country Name</label>
                    <input type="text" class="form-control" id="countryName">
                </div>
                <div class="mb-2">
                    <label>Numeric Code</label>
                    <input type="number" class="form-control" id="numericCode">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="saveCountry()">Save</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
let editModal = new bootstrap.Modal(document.getElementById('editModal'));

function openEditModal(code) {
    axios.get(`/admin/country/edit/${code}`)
        .then(res => {
            const c = res.data;
            document.getElementById('countryCode').value = c.countryCode;
            document.getElementById('countryName').value = c.countryName;
            document.getElementById('numericCode').value = c.numericCode;
            editModal.show();
        })
        .catch(err => Swal.fire("Error", "Failed to load country", "error"));
}

function saveCountry() {
    const code = document.getElementById('countryCode').value;
    const updated = {
        countryCode: code,
        countryName: document.getElementById('countryName').value,
        numericCode: parseInt(document.getElementById('numericCode').value)
    };

    axios.put(`/admin/country/update/${code}`, updated)
        .then(res => {
            Swal.fire("Updated!", res.data, "success");
            editModal.hide();
            window.location.reload(); // reload table
        })
        .catch(err => Swal.fire("Error", err.response ? err.response.data : err.message, "error"));
}
</script>

</body>
</html>
