<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login | PerfectQA</title>
  <link rel="icon" type="image/png" th:href="@{/img/IWPL_LOGO.jpg}">

  <!-- HTMX & NProgress -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/nprogress@0.2.0/nprogress.css">

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!document.body.hasAttribute('hx-boost')) {
            document.body.setAttribute('hx-boost', 'true');
            htmx.process(document.body);
        }
        NProgress.configure({ showSpinner: false, speed: 400 });
        document.addEventListener('htmx:beforeRequest', () => NProgress.start());
        document.addEventListener('htmx:afterRequest', () => NProgress.done());
        document.addEventListener('htmx:onLoadError', () => NProgress.done());
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

</head>

<body class="login-body">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
  :root {
      --bg-deep: #020617; /* Slate 950 */
      --bg-card: rgba(15, 23, 42, 0.6); /* Slate 900 */
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --accent-1: #0ea5e9; /* Light Blue */
      --accent-2: #8b5cf6; /* Violet */
      --accent-3: #ec4899; /* Pink */
      
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --glass-blur: blur(16px);
  }

  body {
    background-color: var(--bg-deep) !important;
    font-family: 'Inter', sans-serif !important;
    min-height: 100vh;
    margin: 0;
    color: var(--text-main);
    overflow-x: hidden;
  }
  
  .login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 70px);
    padding: 40px 20px;
    position: relative;
    z-index: 10;
  }
  
  /* Ambient Orbs */
  .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--accent-2); top: -200px; left: -100px; }
  .orb-2 { width: 400px; height: 400px; background: var(--accent-1); top: 20%; right: -150px; animation-delay: -5s; }
  .orb-3 { width: 600px; height: 600px; background: var(--accent-3); bottom: -200px; left: 20%; opacity: 0.15; }

  @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-50px) scale(1.1); }
  }
  
  /* Container */
  .login-container {
    width: 100%;
    max-width: 440px;
    padding: 20px;
    position: relative;
    z-index: 10;
    animation: fadeIn 0.8s ease-out;
  }
  
  /* Glass Card Design */
  .login-card {
    background: var(--bg-card);
    backdrop-filter: var(--glass-blur);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
  }
  
  /* Title & Subtitle */
  .login-card h2 {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 200% 200%;
    animation: gradientShift 5s ease infinite;
  }

  @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
  }
  
  .login-card .subtitle {
    text-align: center;
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-bottom: 32px;
  }
  
  /* Labels */
  .form-label {
    display: block;
    color: var(--text-muted);
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 6px;
    margin-left: 4px;
  }
  
  /* Input fields */
  .form-control {
    display: block;
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 1rem;
    color: var(--text-main);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .form-control::placeholder {
    color: rgba(148, 163, 184, 0.5);
  }
  
  .form-control:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--accent-1);
    box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    color: var(--text-main);
    outline: none;
  }
  
  /* Checkbox & links */
  .form-check-label, .small {
    color: var(--text-muted);
    font-size: 0.875rem;
  }
  
  .form-check-input {
    width: 1.1em;
    height: 1.1em;
    border-radius: 4px;
    border: 1.5px solid var(--border-color);
    background-color: rgba(255, 255, 255, 0.05);
    transition: background-color 0.2s, border-color 0.2s;
  }
  
  .form-check-input:checked {
    background-color: var(--accent-1);
    border-color: var(--accent-1);
  }
  
  a.small.text-decoration-none {
    color: var(--accent-1);
    font-weight: 500;
    transition: color 0.3s ease;
  }
  
  a.small.text-decoration-none:hover {
    color: #38bdf8;
    text-decoration: none !important;
    text-shadow: 0 0 8px rgba(14, 165, 233, 0.4);
  }
  
  /* Premium Button */
  .btn-primary {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2);
  }
  
  .btn-primary:hover {
    background: linear-gradient(135deg, #0284c7, #7c3aed);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(139, 92, 246, 0.3);
  }
  
  .btn-primary:active {
    transform: translateY(0);
  }
  
  /* Support link */
  .support-link {
    color: var(--text-muted);
    font-size: 0.875rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: color 0.2s;
  }
  
  .support-link:hover {
    color: var(--accent-1);
  }
  
  /* Alert */
  .alert-danger {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 12px;
    color: #fca5a5;
    font-size: 0.875rem;
    padding: 12px;
    backdrop-filter: blur(8px);
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  
  /* ─── Premium Chat Widget ─── */
  #chatWidget {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 1000;
  }
  
  #chatWindow {
    display: none;
    width: 360px;
    height: 520px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    flex-direction: column;
    margin-bottom: 16px;
    overflow: hidden;
    border: 1px solid var(--border-color);
  }
  
  .chat-header {
    background: rgba(2, 6, 23, 0.6);
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
  }
  
  .chat-header h6 {
    margin: 0;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
  }
  
  .chat-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
  }
  .chat-close-btn:hover { color: white; }

  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: transparent;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  
  .chat-message {
    max-width: 85%;
    font-size: 0.9rem;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
  }
  
  .bot-message {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  
  .user-message {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  
  .msg-sender {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
  }

  .chat-input-area {
    padding: 16px;
    background: rgba(2, 6, 23, 0.4);
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border-color);
  }
  
  #chatInputField {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 0.9rem;
    color: white;
    outline: none;
  }
  #chatInputField:focus { border-color: var(--accent-1); }
  
  .chat-send-btn {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white;
    border: none;
    border-radius: 12px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .chat-send-btn:hover { transform: scale(1.05); }
  
  #chatToggleBtn {
    width: 60px;
    height: 60px;
    border-radius: 50% 50% 8px 50%;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border: none;
    color: white;
    font-size: 24px;
    box-shadow: 0 10px 25px rgba(14, 165, 233, 0.3);
    cursor: pointer;
    transition: all 0.3s;
  }
  
  #chatToggleBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
  }
  
  /* NProgress Styling */
  #nprogress .bar {
    background: var(--accent-1) !important;
    height: 3px !important;
  }
  </style>

    <!-- Ambient Background Effects -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
<div class="login-wrapper">
<div class="login-container">
  <div class="login-card">
    <h2 class="text-center mb-1">Welcome Back</h2>
    <p class="subtitle">Sign in to your account</p>

    <form th:action="@{/login}" method="post">

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
      </div>



      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <input type="checkbox" id="rememberMe" class="form-check-input me-1">
          <label for="rememberMe" class="small">Remember me</label>
        </div>
        <a th:href="@{/forgot-password}" class="small text-decoration-none">Forgot Password?</a>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </div>

      <div class="text-center mt-3">
        <a th:href="@{/support/request}" class="support-link">
          <i class="bi bi-headset"></i>
          Need Help? Contact Support
        </a>
      </div>
    </form>

    <div th:if="${error}" class="alert alert-danger text-center mt-3">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${error}"></span>
    </div>

  </div> <!-- end login-card -->
</div> <!-- end login-container -->
</div> <!-- end login-wrapper -->

<!-- Premium Chat Widget -->
<div id="chatWidget">
  <!-- Chat Window -->
  <div id="chatWindow">
    <!-- Header -->
    <div class="chat-header">
      <div>
        <h6>IWPL Support</h6>
        <small><i class="bi bi-circle-fill text-success me-1" style="font-size: 0.5rem;"></i> Always Online</small>
      </div>
      <button class="chat-close-btn" onclick="toggleChat()">&times;</button>
    </div>
    <!-- Messages -->
    <div id="chatMessages">
      <div class="chat-message bot-message">
        Hello! How can we help you accelerate your testing today? 🚀
      </div>
    </div>
    <!-- Input -->
    <div class="chat-input-area">
      <input type="text" id="chatInputField" placeholder="Describe your issue..." 
             onkeypress="if(event.key === 'Enter') sendMessage()">
      <button class="chat-send-btn" onclick="sendMessage()">
        <i class="bi bi-send-fill text-white"></i>
      </button>
    </div>
  </div>
  <!-- Toggle Button -->
  <button id="chatToggleBtn" onclick="toggleChat()">
    <i class="bi bi-chat-dots-fill"></i>
  </button>
</div>

<script>
const autoResponses = {
  'hello':    'Hello! 👋 How can I assist you today?',
  'hi':       'Hi there! How can I help you?',
  'help':     'I\'m here to help! You can ask me about:\n• Login issues\n• Account setup\n• Features\n• Support\n• Pricing\n\nWhat would you like to know?',
  'login':    'For login issues:\n• Make sure you\'re using the correct email and password\n• Click "Forgot Password" if you need to reset it\n• Contact support@iwpl.org if problems persist',
  'password': 'To reset your password:\n• Click "Forgot Password" on the login page\n• Enter your email address\n• Check your inbox for reset instructions\n\nNeed more help? Contact support!',
  'account':  'For account-related questions:\n• New users need admin approval\n• Contact your administrator for account access\n• Email support@iwpl.org for assistance',
  'support':  'You can get support by:\n• Filling out the support form at /support/request\n• Email: support@iwpl.org\n• Our team will respond within 24 hours',
  'feature':  'Our platform includes:\n• Business Scenario Management\n• Test Case Management\n• Ticket System\n• Reports & Analytics\n• User Management\n\nWould you like details on any specific feature?',
  'pricing':  'For pricing information, please contact our sales team at sales@iwpl.org or fill out the support form.',
  'contact':  'You can contact us:\n• Support Form: /support/request\n• Email: support@iwpl.org\n• Phone: Available in support form',
  'ticket':   'To create a ticket:\n• Log in to your account\n• Go to "Raise a Ticket"\n• Fill out the ticket form\n• Submit and track your ticket status',
  'report':   'To generate reports:\n• Log in to your account\n• Navigate to "Reports" section\n• Select the type of report you need\n• Export or view the report',
  'default':  'I understand you need help. Here are some options:\n\n• For login issues: Type "login"\n• For account help: Type "account"\n• For support: Type "support"\n• For features: Type "feature"\n\nOr fill out our support form at /support/request for detailed assistance!'
};

function toggleChat() {
  const chatWindow = document.getElementById('chatWindow');
  chatWindow.style.display = (chatWindow.style.display === 'none' || chatWindow.style.display === '')
    ? 'flex'
    : 'none';
}

function sendMessage() {
  const input = document.getElementById('chatInputField');
  const message = input.value.trim();
  if (message === '') return;

  const messagesDiv = document.getElementById('chatMessages');

  // User message
  const userMsg = document.createElement('div');
  userMsg.className = 'chat-message user-message';
  userMsg.innerHTML = '<div class="msg-sender" style="text-align:right;">You</div>' + message;
  messagesDiv.appendChild(userMsg);
  input.value = '';
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  // Bot response
  setTimeout(() => {
    const response = getAutoResponse(message);
    const botMsg = document.createElement('div');
    botMsg.className = 'chat-message bot-message';
    botMsg.innerHTML = '<div class="msg-sender">Support Bot</div>' + response.replace(/\n/g, '<br>');
    messagesDiv.appendChild(botMsg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }, 500);
}

function getAutoResponse(message) {
  const lower = message.toLowerCase();
  for (const [keyword, response] of Object.entries(autoResponses)) {
    if (keyword !== 'default' && lower.includes(keyword)) return response;
  }
  return autoResponses['default'];
}
</script>

</body>
</html>
