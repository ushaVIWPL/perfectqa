<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<style>
	/* Background */
body {
  background: linear-gradient(135deg, #74ebd5, #9face6);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Container */
.login-container {
  width: 100%;
  max-width: 400px;
}

/* Card */
.login-card {
  background: #ffffff;
  border-radius: 15px;
  padding: 40px 30px;
}

/* Title */
.login-card h2 {
  font-weight: 700;
  color: #2c3e50;
}

/* Input fields */
.form-control {
  border-radius: 8px;
  border: 1px solid #ced4da;
  padding: 12px;
  font-size: 0.95rem;
  transition: 0.2s;
}

.form-control:focus {
  border-color: #0d6efd;
  box-shadow: 0px 0px 6px rgba(13, 110, 253, 0.4);
}

/* Button */
.btn-primary {
  background: linear-gradient(135deg, #007bff, #0056b3);
  border: none;
  border-radius: 25px;
  padding: 12px;
  font-weight: 600;
  transition: all 0.3s ease-in-out;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #0056b3, #004080);
  transform: translateY(-2px);
  box-shadow: 0px 5px 15px rgba(0, 86, 179, 0.3);
}
.alert {
  animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>


</style>
<body>

<div class="login-container">
  <div class="login-card shadow-lg">
    <h2 class="text-center mb-4">Welcome Back</h2>
    <form action="/login" method="post">
      
      <div class="mb-3">
        <label class="form-label">User ID</label>
        <input type="text" class="form-control" name="UserID" placeholder="Enter User ID" required>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="Password" placeholder="Enter Password" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe" class="small">Remember me</label>
        </div>
<a th:href="@{/forgot-password}" class="small text-decoration-none">Forgot Password?</a>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </div>
    </form>
    
    <div th:if="${error}" class="alert alert-danger text-center">
  <span th:text="${error}"></span>
</div>

</body>
</html>
