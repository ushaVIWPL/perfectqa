<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scenario Transaction List</title>
    <link rel="stylesheet" th:href="@{/main.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background-color: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        th, td {
            padding: 14px 16px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #2c3e50;
            color: #fff;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        span.display-mode {
            display: inline-block;
            width: 100%;
        }

        button {
            padding: 6px 10px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
            transition: background-color 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.edit-btn { background-color: #3498db; color: white; }
        button.save-btn { background-color: #2ecc71; color: white; }
        button.delete-btn { background-color: #e74c3c; color: white; }

        tr.editing { background-color: #fff3cd !important; }

        .search-container { margin: 20px 0; text-align: right; }

        #searchInput {
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 300px;
            transition: all 0.2s ease-in-out;
        }

        #searchInput:focus {
            border-color: #3498db;
            box-shadow: 0 0 6px rgba(52, 152, 219, 0.5);
            outline: none;
        }
    </style>
</head>
<body>

<div class="d-flex gap-2 mb-3">
    <a th:href="@{/Menu}" class="btn btn-primary btn-sm">← Mainmenu</a>
    <button class="btn btn-success btn-sm" onclick="downloadCSV()">⬇ Download CSV</button>
</div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="🔍 Search by TransactionSuffix or ScenarioTransactionId">
</div>

<h2>Scenario Transaction List</h2>

<table id="transactionTable">
    <thead>
        <tr>
            <th>ScenarioTransactionId</th>
            <th>Scenario Description</th>
            <th>Wk-Str</th>
            <th>Activity</th>
            <th>Responsible</th>
            <th>Expected Outcome</th>
            <th>Tcode</th>
            <th>BussinessScenarioId</th>
            <th>TransactionSuffix</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="scenario : ${scenarios}">
            <td>
                <span class="display-mode" data-name="transactionKey" th:text="${scenario.transactionKey}"></span>
                <input type="text" name="transactionKey" th:value="${scenario.transactionKey}" class="edit-mode" readonly hidden />
            </td>
            <td>
                <span class="display-mode" data-name="scenarioDescription" th:text="${scenario.scenarioDescription}"></span>
                <input type="text" name="scenarioDescription" th:value="${scenario.scenarioDescription}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="workStream" th:text="${scenario.workStream}"></span>
                <input type="text" name="workStream" th:value="${scenario.workStream}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="activity" th:text="${scenario.activity}"></span>
                <input type="text" name="activity" th:value="${scenario.activity}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="responsible" th:text="${scenario.responsible}"></span>
                <input type="text" name="responsible" th:value="${scenario.responsible}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="expectedOutcome" th:text="${scenario.expectedOutcome}"></span>
                <input type="text" name="expectedOutcome" th:value="${scenario.expectedOutcome}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="tcode" th:text="${scenario.tcode}"></span>
                <input type="text" name="tcode" th:value="${scenario.tcode}" class="edit-mode" hidden />
            </td>
            <td>
                <span class="display-mode" data-name="businessScenario" th:text="${scenario.businessScenario}"></span>
                <input type="text" name="businessScenario" th:value="${scenario.businessScenario}" class="edit-mode" readonly hidden />
            </td>
            <td>
                <span class="display-mode" data-name="transactionSuffix" th:text="${scenario.transactionSuffix}"></span>
                <input type="text" name="transactionSuffix" th:value="${scenario.transactionSuffix}" class="edit-mode" hidden />
            </td>
         <td>
    <!-- Disable Add Test Header button for TESTER -->
    <a th:if="${session.role != null}"
       th:href="@{/api/transactions/addtestheader(transactionKey=${scenario.transactionKey})}"
       th:classappend="${#strings.equalsIgnoreCase(session.role, 'TESTER')} ? ' disabled' : ''"
       th:attr="style=${#strings.equalsIgnoreCase(session.role, 'TESTER')} ? 'pointer-events: none; opacity: 0.6; cursor: not-allowed;' : ''"
       class="btn btn-primary btn-sm">
       Add Test Header
    </a>
</td>

<td>
    <!-- Show Edit button only for non-TESTER -->
    <button type="button" class="edit-btn" onclick="toggleEdit(this)" 
            th:if="${session.role == null or #strings.equalsIgnoreCase(session.role, 'TESTER') == false}">
        Edit
    </button>

    <!-- Save button remains as is -->
    <button type="button" class="save-btn" style="display:none;" onclick="saveTransaction(this)">Save</button>
</td>

                <button type="button" class="save-btn" style="display:none;" onclick="saveTransaction(this)">Save</button>
            </td>
        </tr>
    </tbody>
</table>

<script>
function toggleEdit(btn) {
    const row = btn.closest("tr");
    row.classList.add("editing");
    row.querySelectorAll(".display-mode").forEach(span => span.style.display = "none");
    row.querySelectorAll(".edit-mode").forEach(input => input.hidden = false);
    row.querySelector(".edit-btn").style.display = "none";
    row.querySelector(".save-btn").style.display = "inline-block";
}

function saveTransaction(btn) {
    const row = btn.closest("tr");
    const updatedData = {};
    row.querySelectorAll('input[name]').forEach(input => {
        updatedData[input.name] = input.value;
    });

    fetch("/api/transactions/update", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedData)
    })
    .then(response => {
        if (!response.ok) throw new Error("Update failed");
        return response.json(); // this is your updated entity from backend
    })
    .then(data => {
        Swal.fire("Updated!", "Transaction updated successfully.", "success");

        // Update spans with new values directly from response
       // Update spans with new values from the inputs (always reliable)
row.querySelectorAll("input[name]").forEach(input => {
    const name = input.name;
    const span = row.querySelector(`span[data-name="${name}"]`);
    if (span) {
        span.textContent = input.value;
    }
});

        // Restore edit/view mode
        row.querySelectorAll(".edit-mode").forEach(input => input.hidden = true);
        row.querySelector(".edit-btn").style.display = "inline-block";
        row.querySelector(".save-btn").style.display = "none";
        row.classList.remove("editing");
    })
    .catch(err => Swal.fire("Error", err.message, "error"));
}



// CSV Download
function downloadCSV() {
    const table = document.getElementById("transactionTable");
    const rows = table.querySelectorAll("tr");
    const csv = [];

    rows.forEach(row => {
        const cols = row.querySelectorAll("td, th");
        const rowData = [];
        cols.forEach((col, idx) => {
            if (idx === cols.length - 1) return; // skip actions
            let text = col.innerText.replace(/(\r\n|\n|\r)/gm, "").trim();
            if (text.includes(",")) text = `"${text}"`;
            rowData.push(text);
        });
        csv.push(rowData.join(","));
    });

    const csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
    const downloadLink = document.createElement("a");
    downloadLink.download = "transactions.csv";
    downloadLink.href = window.URL.createObjectURL(csvFile);
    downloadLink.style.display = "none";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}

// Search/filter
document.getElementById('searchInput').addEventListener('input', function() {
    const filter = this.value.toLowerCase();
    document.querySelectorAll('#transactionTable tbody tr').forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(filter) ? '' : 'none';
    });
});
</script>

</body>
</html>
