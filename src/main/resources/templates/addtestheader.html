<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/main.css}">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<head>
    <title>Add Test Case Header</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button[type="submit"] {
            margin-top: 25px;
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        .error-text {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <!--<a th:href="@{/addtra}" class="back-btn">
        <span class="arrow">←</span> Back
    </a>-->

    <a th:href="@{/qaAdminMenuform}" class="back-btn">
        <span class="arrow">←</span> Mainmenu
    </a>
    
   <!-- <a th:href="@{/qaAdminMenuform}" class="back-btn">
        <span class="arrow">←</span> Mainmenu
    </a>
-->
    <h1>Add Test Case Header</h1>
    <h2>Add Test Case Header</h2>
    <div th:if="${message}" class="alert alert-success">
        <p th:text="${message}"></p>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

<form th:object="${testCaseHeader}" method="post" enctype="multipart/form-data"
      th:action="${editMode} ? @{/api/transactions/savetestheaderedit} : @{/api/transactions/savetestheader}">

        <div id="scenario-error" class="error-text" style="text-align: center; font-weight: bold;"></div>

    <input type="hidden" th:field="*{combinedKey}" />

        <label>Scenario Key:</label>
        <input type="text" th:field="*{transactionKey}" readonly />

        <label>Test Case Header No: </label>
        <input type="number" th:field="*{scenario}" />
        <div id="scenario-validation-error" class="error-text"></div>

        <label>Description:</label>
        <textarea th:field="*{description}"></textarea>
        <div id="description-validation-error" class="error-text"></div>

        <label>Work Stream:</label>
        <input type="text" th:field="*{workStream}" />

        <label>Activity:</label>
        <input type="text" th:field="*{activity}" />

        <label>Responsible:</label>
        <input type="text" th:field="*{responsible}" />

        <label>Expected Outcome:</label>
        <textarea th:field="*{expectedOutcome}"></textarea>

        <label>T-Code:</label>
        <input type="text" th:field="*{tCode}" />

        <label>Prerequisites:</label>
        <textarea th:field="*{prerequisites}"></textarea>

        <label>Navigate Steps:</label>
        <textarea th:field="*{navigateSteps}"></textarea>

        <label>Test Data:</label>
        <textarea th:field="*{testData}"></textarea>




<!-- Upload new screenshots -->
<label>Upload Screenshots:</label>
<input type="file" name="files" multiple />

<div>
    <h3>Uploaded Screenshots</h3>
    <div th:each="fileName : ${#strings.arraySplit(testCaseHeader.screenshotPaths, ',')}">
        <img th:src="@{'/uploads/testheaders/' + ${fileName}}" alt="Screenshot" width="200" />
    </div>
</div>

   <label>screenshotPaths:</label>
        <img th:field="*{screenshotPaths}"></img>

        <label>Success Criteria:</label>
        <textarea th:field="*{successCriteria}"></textarea>

        <label>Tested By:</label>
        <input type="text" th:field="*{testedBy}" />

        <label>Start Date:</label>
        <input type="date" th:field="*{startDate}" />

        <label>End Date:</label>
        <input type="date" th:field="*{endDate}" />

        <button type="submit">Save</button>

        <a th:href="@{/api/transactions/testcaseheaders}" class="btn btn-outline-success w-100">view testheaderlist</a>

    </form>
</body>


<div th:if="${message}" class="alert alert-success">
    <p th:text="${message}"></p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const scenarioInput = document.querySelector('[name="scenario"]');
        const descriptionInput = document.querySelector('[name="description"]');
        const scenarioErrorDiv = document.getElementById("scenario-error");
        const scenarioValidationError = document.getElementById("scenario-validation-error");
        const descriptionValidationError = document.getElementById("description-validation-error");

        // Check scenario duplication from server
        scenarioInput.addEventListener("blur", function () {
            const scenario = scenarioInput.value;
            if (scenario) {
                fetch(`/api/transactions/check-scenario?scenario=${scenario}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data === true) {
                            scenarioErrorDiv.textContent = `Scenario ${scenario} already exists!`;
                            scenarioInput.style.borderColor = "red";
                        } else {
                            scenarioErrorDiv.textContent = "";
                            scenarioInput.style.borderColor = "";
                        }
                    })
                    .catch(err => {
                        console.error("Error checking scenario:", err);
                        scenarioErrorDiv.textContent = "Error checking scenario. Try again.";
                    });
            } else {
                scenarioErrorDiv.textContent = "";
                scenarioInput.style.borderColor = "";
            }
        });

        // Form validation
        const form = document.querySelector("form");
        form.addEventListener("submit", function (e) {
            let isValid = true;

            // Validate Test Case Header No (scenario) → required & min 2 digits
            if (!scenarioInput.value || scenarioInput.value.length < 2) {
                isValid = false;
                scenarioValidationError.textContent = "Test Case Header No must be at least 2 digits.";
                scenarioInput.style.borderColor = "red";
            } else {
                scenarioValidationError.textContent = "";
                scenarioInput.style.borderColor = "";
            }

            // Validate Description → required
            if (!descriptionInput.value.trim()) {
                isValid = false;
                descriptionValidationError.textContent = "Description is required.";
                descriptionInput.style.borderColor = "red";
            } else {
                descriptionValidationError.textContent = "";
                descriptionInput.style.borderColor = "";
            }

            if (!isValid) {
                e.preventDefault();
            }
        });
    });
</script>

<script th:inline="javascript" th:if="${message != null}">
    Swal.fire({
        icon: 'success',
        title: 'Success',
        text: [[${message}]],
        confirmButtonColor: '#3085d6',
        confirmButtonText: 'OK'
    });
</script>


</html>
