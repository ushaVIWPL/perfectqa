<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Business Scenarios Report | PerfectQA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent-purple: #a78bfa;
        --accent-blue: #60a5fa;
        --accent-green: #34d399;
        --accent-red: #f87171;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        color: #f8fafc;
        margin: 0;
        padding: 0;
    }

    .main-page-content { padding: 40px 20px; }

    .report-container { max-width: 1600px; margin: 0 auto; }

    .dashboard-header {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 30px 40px;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
    }

    .header-title-area h2 {
        font-family: 'Outfit', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
        background: linear-gradient(90deg, #a78bfa, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .badge-total-scenarios {
        background: linear-gradient(135deg, rgba(167, 139, 250, 0.15), rgba(96, 165, 250, 0.15));
        border: 1px solid rgba(167, 139, 250, 0.3);
        color: #a78bfa;
        padding: 4px 14px;
        border-radius: 30px;
        font-size: 0.85rem;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        vertical-align: middle;
        letter-spacing: 0.5px;
        box-shadow: 0 0 15px rgba(167, 139, 250, 0.1);
        display: inline-flex;
        align-items: center;
    }

    .header-title-area p { color: #94a3b8; margin: 5px 0 0 0; }

    .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn-premium {
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        transition: all 0.3s;
        border: none;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .btn-green { background: linear-gradient(135deg, #059669, #34d399); color: white; }
    .btn-red { background: linear-gradient(135deg, #dc2626, #f87171); color: white; }
    .btn-violet { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; }
    .btn-glass { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: white; }
    .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

    /* Stat Cards */
    .stat-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 25px;
        text-align: center;
        backdrop-filter: blur(10px);
    }

    .stat-card .number {
        font-family: 'Outfit', sans-serif;
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(90deg, #a78bfa, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .stat-card .label { color: #94a3b8; font-size: 0.85rem; margin-top: 5px; }

    .company-badge {
        background: rgba(167, 139, 250, 0.1);
        color: #a78bfa;
        padding: 6px 14px;
        border-radius: 10px;
        font-weight: 700;
        font-family: monospace;
        border: 1px solid rgba(167, 139, 250, 0.2);
    }

    /* Table Card */
    .table-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        overflow: hidden;
        backdrop-filter: blur(10px);
    }

    .table-responsive { width: 100%; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th {
        background: rgba(255, 255, 255, 0.03);
        padding: 16px 18px;
        text-align: left;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent-purple);
        font-weight: 700;
        border-bottom: 1px solid var(--glass-border);
    }

    td {
        padding: 16px 18px;
        color: #cbd5e1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        font-size: 0.88rem;
    }

    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .scenario-badge {
        background: rgba(96, 165, 250, 0.1);
        color: #60a5fa;
        padding: 5px 12px;
        border-radius: 8px;
        font-weight: 700;
        font-family: monospace;
        font-size: 0.8rem;
        border: 1px solid rgba(96, 165, 250, 0.2);
    }

    .empty-state { text-align: center; padding: 80px 20px; color: #94a3b8; }
    .empty-state i { font-size: 4rem; display: block; margin-bottom: 20px; opacity: 0.3; }

    /* ──────────────────── STANDARDIZED PRINT STYLES ──────────────────── */
    @media print {
        @page { margin: 1cm; size: landscape; }
        body { background: white !important; color: black !important; margin: 0; padding: 0; }
        .no-print, .navbar, .btn-premium, .header-actions, .dashboard-header p, .topbar { display: none !important; }
        
        .main-page-content { padding: 0 !important; }
        .report-container { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
        
        .dashboard-header { 
            background: white !important; 
            border: none !important; 
            padding: 0 0 10px 0 !important; 
            margin-bottom: 10px !important;
            backdrop-filter: none !important;
            display: block !important;
            text-align: center !important;
            box-shadow: none !important;
        }
        .dashboard-header h2 { 
            color: black !important; 
            background: none !important; 
            -webkit-text-fill-color: initial !important;
            font-size: 24pt !important;
            margin-bottom: 5px !important;
            font-weight: bold !important;
        }

        .stat-row { 
            display: flex !important;
            justify-content: center !important;
            gap: 40px !important;
            margin-bottom: 20px !important;
        }
        .stat-card { 
            background: white !important; 
            border: none !important; 
            padding: 5px !important;
            backdrop-filter: none !important;
            flex: none !important;
            box-shadow: none !important;
        }
        .stat-card .number { 
            font-size: 22pt !important; 
            background: none !important; 
            -webkit-text-fill-color: initial !important;
            color: black !important;
            font-weight: bold !important;
        }
        .stat-card .label { color: #555 !important; font-size: 10pt !important; text-transform: uppercase; }
        
        .company-badge {
            background: none !important;
            color: black !important;
            border: none !important;
            padding: 0 !important;
            font-size: 18pt !important;
            font-weight: bold !important;
        }

        .table-card { 
            background: white !important; 
            border: 1px solid #ddd !important; 
            border-radius: 0 !important; 
            box-shadow: none !important;
        }
        table { width: 100% !important; border-collapse: collapse !important; }
        th { 
            background: #f2f2f2 !important; 
            color: black !important; 
            border-bottom: 2px solid black !important; 
            padding: 10pt 8pt !important;
            font-size: 9pt !important;
        }
        td { 
            color: black !important; 
            border-bottom: 1px solid #eee !important; 
            padding: 8pt 8pt !important;
            font-size: 9pt !important;
        }
        .scenario-badge { background: none !important; color: black !important; border: none !important; font-weight: bold !important; padding: 0 !important; }
        .badge-total-scenarios {
            background: none !important;
            border: 1px solid #333 !important;
            color: black !important;
            box-shadow: none !important;
            padding: 2px 8px !important;
            font-size: 11pt !important;
            font-weight: bold !important;
            display: inline-flex !important;
            border-radius: 5px !important;
            margin-left: 10px !important;
            -webkit-text-fill-color: initial !important;
        }
    }

    @media (max-width: 768px) {
        .dashboard-header { padding: 25px; flex-direction: column; text-align: center; }
        .header-actions { justify-content: center; width: 100%; }
    }
</style>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-page-content">
    <div class="report-container">

        <div class="dashboard-header">
            <div class="header-title-area">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <div>
                        <h2 class="d-flex align-items-center gap-2 flex-wrap">
                            <span><i class="bi bi-diagram-3"></i> Business Scenario Report</span>
                            <span class="badge-total-scenarios" th:text="'Total: ' + ${totalScenarios}">Total: 0</span>
                        </h2>
                        <p>Complete list of all business scenarios for your company</p>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <a th:href="@{/Menu/BusinessScenarios}" class="btn-premium btn-glass"><i class="bi bi-arrow-left"></i> Back</a>
                <a th:href="@{/api/report-business-scenarios/excel}" class="btn-premium btn-green" download hx-boost="false">
                    <i class="bi bi-file-earmark-excel"></i> Excel
                </a>
             
                <button onclick="window.print()" class="btn-premium btn-violet">
                    <i class="bi bi-printer"></i> Print
                </button>
            </div>
        </div>

        <div th:if="${scenarios == null or scenarios.isEmpty()}" class="table-card">
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <h4>No business scenarios found</h4>
                <p>Please add business scenarios to see them in the report.</p>
            </div>
        </div>

        <div th:if="${scenarios != null and !scenarios.isEmpty()}" class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Business Scenario</th>
                            <th>Activity</th>
                            <th>Description</th>
                            <th>Expected Outcome</th>
                            <th>Responsible</th>
                            <th>Work Stream</th>
                            <th>T-Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="scenario : ${scenarios}">
                            <td><span class="scenario-badge" th:text="${scenario.id.businessScenario}"></span></td>
                            <td th:text="${scenario.activity}"></td>
                            <td th:text="${scenario.scenarioDescription}"></td>
                            <td th:text="${scenario.expectedOutcome}"></td>
                            <td th:text="${scenario.responsible}"></td>
                            <td th:text="${scenario.workStream}"></td>
                            <td th:text="${scenario.tcode}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
