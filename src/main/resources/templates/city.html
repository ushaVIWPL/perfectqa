<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>City List</title>
    <script>
        function enableEdit(rowId) {
            document.getElementById("display-" + rowId).style.display = "none";
            document.getElementById("edit-" + rowId).style.display = "table-row";
        }

        function cancelEdit(rowId) {
            document.getElementById("display-" + rowId).style.display = "";
            document.getElementById("edit-" + rowId).style.display = "none";
        }
    </script>
    <title>City List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<h2>City List</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>City</th>
            <th>Subdivision Code</th>
            <th>Province Code</th>
            <th>Province</th>
            <th>Country</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${cities}">
            <td th:text="${c.city}"></td>
            <td th:text="${c.subdivisionCode}"></td>
            <td th:text="${c.ProvinceCode}"></td>
            <td th:text="${c.Province}"></td>
            <td th:text="${c.country}"></td>
            <td>
                <button type="button" class="btn btn-primary"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#editModal-' + ${c.city}">
                    Edit
                </button>
            </td>
        </tr>
    </tbody>
</table>

<!-- Modals for each city -->
<div th:each="c : ${cities}" th:id="'editModal-' + ${c.city}" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/update}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Edit City: <span th:text="${c.city}"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="city" th:value="${c.city}"/>
                    <div class="mb-2">
                        <label>Subdivision Code</label>
                        <input type="text" class="form-control" name="subdivisionCode" th:value="${c.subdivisionCode}"/>
                    </div>
                    <div class="mb-2">
                        <label>Province Code</label>
                        <input type="text" class="form-control" name="ProvinceCode" th:value="${c.ProvinceCode}"/>
                    </div>
                    <div class="mb-2">
                        <label>Province</label>
                        <input type="text" class="form-control" name="Province" th:value="${c.Province}"/>
                    </div>
                    <div class="mb-2">
                        <label>Country</label>
                        <input type="text" class="form-control" name="country" th:value="${c.country}"/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>

</html>
