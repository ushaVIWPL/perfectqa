<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Ticket</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      width: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px 40px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #005fa3;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Create New Ticket</h2>
    <form action="CreateTicketServlet" method="post">
      
      <label for="companyCode">Company Code</label>
      <input type="number" id="companyCode" name="companyCode" placeholder="Enter Company Code" required>

      <label for="applicationCode">Application Code</label>
      <input type="number" id="applicationCode" name="applicationCode" placeholder="Enter Application Code" required>

      <label for="moduleCode">Module Code</label>
      <input type="number" id="moduleCode" name="moduleCode" placeholder="Enter Module Code" required>

      <label for="issueType">Issue Type</label>
      <select id="issueType" name="issueType" required>
        <option value="">-- Select Issue Type --</option>
        <option value="Bug">Bug</option>
        <option value="Enhancement">Enhancement</option>
        <option value="Task">Task</option>
        <option value="Feature Request">Feature Request</option>
      </select>

      <label for="issueDescription">Issue Description</label>
      <textarea id="issueDescription" name="issueDescription" placeholder="Describe the issue..." required></textarea>

      <div class="row">
        <div>
          <label for="userCode">User Code</label>
          <input type="number" id="userCode" name="userCode" placeholder="Enter User Code" required>
        </div>
        <div>
          <label for="assignee1UserCode">Assignee User Code</label>
          <input type="number" id="assignee1UserCode" name="assignee1UserCode" placeholder="Enter Assignee Code" required>
        </div>
      </div>

      <label for="assignee1ExpectedDate">Expected Resolution Date</label>
      <input type="date" id="assignee1ExpectedDate" name="assignee1ExpectedDate" required>

      <label for="attachments">Attachment (Optional)</label>
      <input type="file" id="attachments" name="attachments">

      <label for="additionalComments">Additional Comments</label>
      <textarea id="additionalComments" name="additionalComments" placeholder="Any extra details..."></textarea>

      <button type="submit">Create Ticket</button>
    </form>
  </div>
</body>
</html>
