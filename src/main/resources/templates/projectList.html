<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Projects</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h3>All Projects</h3>

    <!-- Add New Project Button triggers modal -->
    <button class="btn btn-success mb-2" data-bs-toggle="modal" data-bs-target="#projectModal"
            onclick="clearForm()">Add New Project</button>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Project Code</th>
            <th>Project Name</th>
            <th>Company</th>
            <th>Exec Sponsor</th>
            <th>Bus Sponsor</th>
            <th>Budget Lead</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${projects}">
            <td th:text="${p.projectCode}"></td>
            <td th:text="${p.projectName}"></td>
            <td th:text="${p.company.companyName}"></td>
            <td th:text="${p.execSponsor}"></td>
            <td th:text="${p.busSponsor}"></td>
            <td th:text="${p.budgetLead}"></td>
            <td>
                <!-- You can add Edit/Delete buttons here -->
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Add Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/project/save}" th:object="${project}" method="post" id="projectForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Project Code</label>
                            <input type="text" class="form-control" th:field="*{projectCode}" required>
                        </div>
                        <div class="col-md-6">
                            <label>Project Name</label>
                            <input type="text" class="form-control" th:field="*{projectName}" required>
                        </div>
                 <div class="col-md-6">
    <label>Company</label>
    <select class="form-select" name="companyCode" required>
        <option value="" disabled selected>Select Company</option>
        <option th:each="c : ${companies}" 
                th:value="${c.companyCode}" 
                th:text="${c.companyName}">
        </option>
    </select>
</div>

                        <div class="col-md-6">
                            <label>Executive Sponsor</label>
                            <input type="text" class="form-control" th:field="*{execSponsor}">
                        </div>
                        <div class="col-md-6">
                            <label>Business Sponsor</label>
                            <input type="text" class="form-control" th:field="*{busSponsor}">
                        </div>
                        <div class="col-md-6">
                            <label>Budget Lead</label>
                            <input type="text" class="form-control" th:field="*{budgetLead}">
                        </div>
                        <div class="col-md-12">
                            <label>Business Goal</label>
                            <textarea class="form-control" th:field="*{businessGoal}"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label>Functional Goal</label>
                            <textarea class="form-control" th:field="*{functionalGoal}"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label>Financial Goal</label>
                            <textarea class="form-control" th:field="*{financialGoal}"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label>Efficiency Goal</label>
                            <textarea class="form-control" th:field="*{efficiencyGoal}"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label>QA Goal</label>
                            <textarea class="form-control" th:field="*{qaGoal}"></textarea>
                        </div>
                        <div class="col-md-12">
                            <label>Project Description</label>
                            <textarea class="form-control" th:field="*{projectDescription}"></textarea>
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <button type="submit" class="btn btn-primary">Save Project</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function clearForm() {
    document.getElementById('projectForm').reset();
    document.getElementById('modalTitle').innerText = "Add Project";
}
</script>
</body>
</html>
