<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Business Scenario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0; padding: 20px; min-height: 100vh;
            color: #f8fafc;
        }
        .container-fluid { padding: 0 40px; }

        /* Header */
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Form Card */
        .form-card {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .form-label {
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 8px;
            display: block;
        }

        .required-field::after { content: " *"; color: #f87171; }

        /* Input styling */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
            outline: none;
            color: #f8fafc;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-control[readonly] { 
            background: rgba(255, 255, 255, 0.02) !important; 
            color: #94a3b8; 
            cursor: not-allowed; 
        }
        
        .form-group { margin-bottom: 25px; }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            min-width: 250px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); color: white; }

        .error-msg { color: #f87171; font-size: 0.85em; margin-top: 5px; }
        .text-muted { font-size: 0.85em; }

        h4.text-primary {
            color: #a78bfa !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>


<div class="container-fluid">
    <!-- Top Navigation -->
    <div class="nav-header">
    <!--    <div>
            <button onclick="history.back()" class="btn btn-outline-light me-2">
                <i class="bi bi-arrow-left"></i> Back
            </button>
            <a th:href="@{/Menu}" class="btn btn-light shadow-sm">
                <i class="bi bi-house"></i> Main Menu
            </a>
        </div>-->
      
    </div>

    <!-- Header -->
    <div class="page-header">
        <div>
            <h2 class="m-0" th:if="${editMode == null or !editMode}">
                <i class="bi bi-plus-circle"></i> Add Business Scenario
            </h2>
            <h2 class="m-0" th:if="${editMode != null and editMode}">
                <i class="bi bi-pencil-square"></i> Edit Business Scenario
            </h2>
        </div>
        <a th:href="@{/list}" class="btn" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 10px; font-weight: 600; padding: 10px 20px; transition: all 0.3s ease;">
            <i class="bi bi-list-ul"></i> View Business Scenarios
        </a>
    </div>

    <!-- Messages -->
    <div th:if="${success}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
    </div>

    <!-- Form -->
    <div class="form-card">
        <form th:action="@{/save}" th:object="${scenario}" method="post" onsubmit="return validateBusinessScenarioForm()">

            <input type="hidden" th:field="*{id.companyCode}" />
            <input type="hidden" name="editMode" th:value="${editMode}" />

            <h4 class="mb-4 text-primary border-bottom pb-2">Identification</h4>
            <div class="row">
                <div class="col-md-12 form-group">
                    <label class="form-label required-field">Scenario ID</label>
                    <input type="text" class="form-control w-25" th:field="*{id.businessScenario}" th:readonly="${editMode != null and editMode}" id="businessScenario" maxlength="3" pattern="[0-9]{1,3}" required placeholder="e.g., 001, 002" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    <small th:if="${editMode != null and editMode}" class="text-muted">Cannot be changed in edit mode</small>
                    <small th:if="${editMode == null or !editMode}" class="text-muted">Only numbers allowed (max 3 digits)</small>
                    <div class="error-msg" id="businessScenarioError"></div>
                </div>
                
            </div>

            <h4 class="mb-4 mt-4 text-primary border-bottom pb-2">Scenario Details</h4>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label">  Scenario Name</label>
                    <input type="text" class="form-control" th:field="*{activity}" placeholder="Enter activity">
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label">T-Code</label>
                    <input type="text" class="form-control" th:field="*{tcode}" placeholder="Enter T-Code">
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 form-group">
                    <label class="form-label required-field"> Scenario Description</label>
                    <textarea class="form-control" th:field="*{scenarioDescription}" placeholder="Enter scenario description" required rows="4"></textarea>
                    <div class="error-msg" id="descriptionError"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 form-group">
                    <label class="form-label"> Expected Outcome from Scenario</label>
                    <textarea class="form-control" th:field="*{expectedOutcome}" placeholder="Describe expected outcome" rows="4"></textarea>
                </div>
            </div>

            <h4 class="mb-4 mt-4 text-primary border-bottom pb-2">Ownership</h4>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label">Work Stream</label>
                    <input type="text" class="form-control" th:field="*{workStream}" placeholder="Enter work stream">
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label">Responsible</label>
                    <input type="text" class="form-control" th:field="*{responsible}" placeholder="Enter responsible person">
                </div>
            </div>

            <div class="text-end mt-4">
                <button type="submit" class="btn-submit">
                    <i class="bi bi-floppy"></i> <span th:text="${editMode != null and editMode} ? 'Update Scenario' : 'Save Scenario'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const businessScenario = document.getElementById('businessScenario');
    const businessScenarioError = document.getElementById('businessScenarioError');

    if (businessScenario && !businessScenario.readOnly) {
        businessScenario.addEventListener('input', function() {
            const val = this.value.trim();
            if (!val) {
                businessScenarioError.textContent = '';
                return;
            }

            // Check formatting first
            const numericPattern = /^[0-9]{1,3}$/;
            if (!numericPattern.test(val)) {
                businessScenarioError.textContent = 'Business Scenario must be 1-3 digits only';
                businessScenarioError.style.color = '#dc3545';
                return;
            }

            // Perform AJAX check
            fetch(`/api/scenarios/exists?businessScenario=${encodeURIComponent(val)}`)
                .then(res => res.json())
                .then(data => {
                    // Check if value hasn't changed since the request was sent
                    if (businessScenario.value.trim() === val) {
                        if (data.exists) {
                            businessScenarioError.textContent = 'Duplicate Scenario Number! This scenario already exists.';
                            businessScenarioError.style.color = '#dc3545';
                        } else {
                            businessScenarioError.textContent = '';
                        }
                    }
                })
                .catch(err => console.error('Error checking duplicate:', err));
        });
    }
});

function validateBusinessScenarioForm() {
    const businessScenario = document.getElementById('businessScenario');
    const businessScenarioError = document.getElementById('businessScenarioError');
    
    if (businessScenarioError && businessScenarioError.textContent.trim() !== '') {
        businessScenario.focus();
        return false;
    }
    
    if (!businessScenario.value || businessScenario.value.trim() === '') {
        businessScenarioError.textContent = 'Business Scenario is required';
        businessScenarioError.style.color = '#dc3545';
        businessScenario.focus();
        return false;
    }
    
    const numericPattern = /^[0-9]{1,3}$/;
    if (!numericPattern.test(businessScenario.value)) {
        businessScenarioError.textContent = 'Business Scenario must be 1-3 digits only';
        businessScenarioError.style.color = '#dc3545';
        businessScenario.focus();
        return false;
    }
    
    const description = document.querySelector('[name="scenarioDescription"]');
    const descriptionError = document.getElementById('descriptionError');
    descriptionError.textContent = '';

    if (!description.value.trim()) {
        descriptionError.textContent = 'Description is required';
        description.focus();
        return false;
    }

    return true;
}
</script>

</body>
</html>
