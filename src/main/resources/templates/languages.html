<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Languages Master | IWPL Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<style>
  .lang-page {
    font-family: 'Inter', sans-serif;
    color: #f8fafc;
  }
  .lang-stats {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .lang-stat-card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 180px;
    backdrop-filter: blur(12px);
  }
  .lang-stat-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    color: white;
  }
  .lang-stat-val {
    font-family: 'Outfit', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.1;
  }
  .lang-stat-lbl {
    font-size: 0.7rem;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .lang-card {
    background: rgba(30, 41, 59, 0.55);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    overflow: hidden;
  }
  .lang-card-head {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .lang-card-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    margin: 0;
  }
  .lang-card-sub {
    font-size: 0.8rem;
    color: #94a3b8;
    margin: 2px 0 0 0;
  }
  .search-input-box {
    position: relative;
    min-width: 220px;
  }
  .search-input-box i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748b;
  }
  .search-input-box input {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: white;
    padding: 8px 12px 8px 36px;
    font-size: 0.88rem;
    width: 100%;
  }
  .search-input-box input:focus {
    outline: none;
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
  }
  .btn-add-lang {
    background: linear-gradient(135deg, #ec4899, #db2777);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 9px 18px;
    font-weight: 600;
    font-size: 0.88rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
  }
  .btn-add-lang:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    color: white;
  }
  .custom-table {
    width: 100%;
    color: #f8fafc;
    border-collapse: collapse;
    margin: 0;
  }
  .custom-table thead th {
    background: rgba(15, 23, 42, 0.5);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: #94a3b8;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 14px 20px;
    font-weight: 700;
  }
  .custom-table tbody td {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    vertical-align: middle;
    font-size: 0.9rem;
  }
  .custom-table tbody tr:hover {
    background: rgba(255, 255, 255, 0.03);
  }
  .badge-code {
    background: rgba(236, 72, 153, 0.15);
    color: #f472b6;
    border: 1px solid rgba(236, 72, 153, 0.3);
    border-radius: 8px;
    padding: 4px 10px;
    font-weight: 700;
    font-size: 0.8rem;
    font-family: monospace;
  }
  .action-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .action-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: white;
  }
  .action-btn.btn-delete:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.4);
    color: #f87171;
  }
  /* Dark Modal */
  .modal-content-dark {
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    color: white;
  }
  .modal-header-dark {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 20px 24px;
  }
  .modal-footer-dark {
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 16px 24px;
  }
  .form-label-dark {
    color: #94a3b8;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-control-dark {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: white;
    padding: 10px 14px;
  }
  .form-control-dark:focus {
    background: rgba(30, 41, 59, 1);
    border-color: #ec4899;
    box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
    color: white;
  }
  .form-control-dark:disabled, 
  .form-control-dark[readonly],
  .form-control-dark:disabled:read-only {
    background: rgba(15, 23, 42, 0.7) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #94a3b8 !important;
    opacity: 1 !important;
    cursor: not-allowed;
  }
</style>

<div class="lang-page">
  <!-- Stats Header -->
  <div class="lang-stats">
    <div class="lang-stat-card">
      <div class="lang-stat-icon"><i class="bi bi-translate"></i></div>
      <div>
        <div class="lang-stat-val" th:text="${languages != null ? languages.size() : 0}">0</div>
        <div class="lang-stat-lbl">Supported Languages</div>
      </div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="lang-card">
    <div class="lang-card-head">
      <div>
        <h3 class="lang-card-title"><i class="bi bi-translate me-2 text-pink" style="color:#ec4899;"></i>Language Master Directory</h3>
        <p class="lang-card-sub">Manage supported languages and ISO language standards.</p>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div class="search-input-box">
          <i class="bi bi-search"></i>
          <input type="text" id="langSearchInput" placeholder="Search languages..." onkeyup="filterLangTable()">
        </div>
        <button class="btn-add-lang" onclick="openAddLangModal()">
          <i class="bi bi-plus-lg"></i> Add Language
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="custom-table" id="langTable">
        <thead>
          <tr>
            <th>ISO Code</th>
            <th>Language Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="lang : ${languages}">
            <td><span class="badge-code" th:text="${lang.languageCode}"></span></td>
            <td class="fw-semibold text-white" th:text="${lang.language}"></td>
            <td class="text-end">
              <button class="action-btn me-1 btn-edit-lang" title="Edit Language" th:data-code="${lang.languageCode}">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="action-btn btn-delete btn-delete-lang" title="Delete Language" th:data-code="${lang.languageCode}">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr th:if="${languages == null or #lists.isEmpty(languages)}">
            <td colspan="3" class="text-center py-4 text-muted">No languages found. Click "Add Language" to register one.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add Language Modal -->
<div class="modal fade" id="addLangModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-dark">
      <div class="modal-header modal-header-dark">
        <h5 class="modal-title font-outfit fw-bold"><i class="bi bi-plus-circle me-2" style="color:#ec4899;"></i>Add New Language</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label-dark">ISO Language Code</label>
          <input type="text" class="form-control form-control-dark" id="addLangCode" placeholder="e.g. en, es, fr, hi" maxlength="10">
        </div>
        <div class="mb-3">
          <label class="form-label-dark">Language Name</label>
          <input type="text" class="form-control form-control-dark" id="addLangName" placeholder="e.g. English, Spanish, French, Hindi">
        </div>
      </div>
      <div class="modal-footer modal-footer-dark">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn text-white rounded-pill px-4" style="background:linear-gradient(135deg, #ec4899, #db2777);" onclick="saveAddLang()">Save Language</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Language Modal -->
<div class="modal fade" id="editLangModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content modal-content-dark">
      <div class="modal-header modal-header-dark">
        <h5 class="modal-title font-outfit fw-bold"><i class="bi bi-pencil-square me-2" style="color:#ec4899;"></i>Edit Language</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="editLangCodeKey">
        <div class="mb-3">
          <label class="form-label-dark">ISO Language Code</label>
          <input type="text" class="form-control form-control-dark" id="displayLangCode" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label-dark">Language Name</label>
          <input type="text" class="form-control form-control-dark" id="editLangName" placeholder="Enter language name">
        </div>
      </div>
      <div class="modal-footer modal-footer-dark">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn text-white rounded-pill px-4" style="background:linear-gradient(135deg, #ec4899, #db2777);" onclick="saveEditLang()">Update Language</button>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('click', function(e) {
    var editBtn = e.target.closest('.btn-edit-lang');
    if (editBtn) {
      var code = editBtn.getAttribute('data-code');
      if (code) openEditLangModal(code);
    }
    var delBtn = e.target.closest('.btn-delete-lang');
    if (delBtn) {
      var code = delBtn.getAttribute('data-code');
      if (code) deleteLang(code);
    }
  });

  function filterLangTable() {
    var input = document.getElementById('langSearchInput').value.toLowerCase();
    var rows = document.querySelectorAll('#langTable tbody tr');
    rows.forEach(function(row) {
      var text = row.innerText.toLowerCase();
      row.style.display = text.indexOf(input) > -1 ? '' : 'none';
    });
  }

  function openAddLangModal() {
    document.getElementById('addLangCode').value = '';
    document.getElementById('addLangName').value = '';
    var modal = new bootstrap.Modal(document.getElementById('addLangModal'));
    modal.show();
  }

  function saveAddLang() {
    var code = document.getElementById('addLangCode').value.trim();
    var name = document.getElementById('addLangName').value.trim();

    if (!code || !name) {
      Swal.fire({ icon: 'warning', title: 'Missing Info', text: 'Language Code and Name are required.', background: '#0f172a', color: '#fff' });
      return;
    }

    var payload = {
      languageCode: code,
      language: name
    };

    fetch('/admin/languages/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(res) {
      if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
      return res.json();
    })
    .then(function() {
      var modalEl = document.getElementById('addLangModal');
      var modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
      Swal.fire({ icon: 'success', title: 'Success!', text: 'Language added successfully.', timer: 1500, showConfirmButton: false, background: '#0f172a', color: '#fff' });
      if (typeof loadContent === 'function') {
        loadContent('/admin/languages');
      } else {
        location.reload();
      }
    })
    .catch(function(err) {
      Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to add language.', background: '#0f172a', color: '#fff' });
    });
  }

  function openEditLangModal(code) {
    fetch('/admin/languages/get/' + encodeURIComponent(code))
    .then(function(res) {
      if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
      return res.json();
    })
    .then(function(data) {
      document.getElementById('editLangCodeKey').value = data.languageCode || '';
      document.getElementById('displayLangCode').value = data.languageCode || '';
      document.getElementById('editLangName').value = data.language || '';
      var modal = new bootstrap.Modal(document.getElementById('editLangModal'));
      modal.show();
    })
    .catch(function(err) {
      Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Could not load language details.', background: '#0f172a', color: '#fff' });
    });
  }

  function saveEditLang() {
    var code = document.getElementById('editLangCodeKey').value;
    var name = document.getElementById('editLangName').value.trim();

    if (!name) {
      Swal.fire({ icon: 'warning', title: 'Missing Info', text: 'Language Name is required.', background: '#0f172a', color: '#fff' });
      return;
    }

    var payload = {
      languageCode: code,
      language: name
    };

    fetch('/admin/languages/update/' + encodeURIComponent(code), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(res) {
      if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
      return res.text();
    })
    .then(function() {
      var modalEl = document.getElementById('editLangModal');
      var modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();
      Swal.fire({ icon: 'success', title: 'Updated!', text: 'Language updated successfully.', timer: 1500, showConfirmButton: false, background: '#0f172a', color: '#fff' });
      if (typeof loadContent === 'function') {
        loadContent('/admin/languages');
      } else {
        location.reload();
      }
    })
    .catch(function(err) {
      Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to update language.', background: '#0f172a', color: '#fff' });
    });
  }

  function deleteLang(code) {
    Swal.fire({
      title: 'Delete Language?',
      text: 'Are you sure you want to delete language: ' + code + '?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#ef4444',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Yes, Delete',
      background: '#0f172a',
      color: '#fff'
    }).then(function(result) {
      if (result.isConfirmed) {
        fetch('/admin/languages/delete/' + encodeURIComponent(code), {
          method: 'POST'
        })
        .then(function(res) {
          if (!res.ok) return res.text().then(function(t) { throw new Error(t); });
          return res.text();
        })
        .then(function() {
          Swal.fire({ icon: 'success', title: 'Deleted!', text: 'Language deleted successfully.', timer: 1500, showConfirmButton: false, background: '#0f172a', color: '#fff' });
          if (typeof loadContent === 'function') {
            loadContent('/admin/languages');
          } else {
            location.reload();
          }
        })
        .catch(function(err) {
          Swal.fire({ icon: 'error', title: 'Cannot Delete', text: err.message || 'Failed to delete language.', background: '#0f172a', color: '#fff' });
        });
      }
    });
  }
</script>

</body>
</html>
