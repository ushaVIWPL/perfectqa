<style>
        /* ===== GLOBAL STYLES ===== */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fc;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4, h5 {
            font-weight: 600;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: linear-gradient(90deg, #0d6efd, #400080);
        }

        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff !important;
        }

        .nav-link {
            color: #fff !important;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: #ffc107 !important;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            background: linear-gradient(to right, #0d6efd, #400080);
            color: white;
            padding: 120px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.25rem;
            margin: 20px auto;
            max-width: 700px;
        }

        .hero .btn {
            border-radius: 30px;
            padding: 10px 25px;
        }

        /* ===== FEATURES ===== */
        .feature-card {
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* ===== HOW IT WORKS ===== */
        .step {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .circle-num {
            width: 70px;
            height: 70px;
            line-height: 70px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: #fff;
            font-size: 1.5rem;
            margin: 0 auto 15px;
            font-weight: bold;
        }

        /* ===== TESTIMONIALS ===== */
        .testimonial {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .testimonial img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        /* ===== FOOTER ===== */
        footer {
            background: #222;
            color: white;
            padding: 30px 0;
        }

        footer a {
            color: #ffc107;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
