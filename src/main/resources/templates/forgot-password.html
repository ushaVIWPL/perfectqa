<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - PerfectQA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
  
  <!-- HTMX & NProgress -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/nprogress@0.2.0/nprogress.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/nprogress@0.2.0/nprogress.css">

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (!document.body.hasAttribute('hx-boost')) {
            document.body.setAttribute('hx-boost', 'true');
            document.body.setAttribute('hx-swap', 'innerHTML transition:true');
            htmx.process(document.body);
        }
        NProgress.configure({ showSpinner: false, speed: 400 });
        document.addEventListener('htmx:beforeRequest', () => NProgress.start());
        document.addEventListener('htmx:afterRequest', () => NProgress.done());
        document.addEventListener('htmx:onLoadError', () => NProgress.done());
    });
  </script>
</head>

<body>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
/* Background with premium dark aesthetic */
body { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); font-family: 'Inter', system-ui, -apple-system, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; color: #f8fafc; }
body::before { content: ''; position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%); top: -200px; left: -200px; border-radius: 50%; pointer-events: none; z-index: 0; }
body::after { content: ''; position: fixed; width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.05) 0%, transparent 70%); bottom: -150px; right: -150px; border-radius: 50%; pointer-events: none; z-index: 0; }
.login-container { width: 100%; max-width: 440px; padding: 20px; position: relative; z-index: 10; animation: fadeIn 0.8s ease-out; }
.login-card { background: #ffffff; border-radius: 24px; padding: 48px 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: #1e293b; }
.login-card h2 { font-family: 'Outfit', sans-serif; font-weight: 700; color: #0f172a; font-size: 1.75rem; letter-spacing: -0.025em; margin-bottom: 8px; text-align: center; }
.login-card .subtitle { text-align: center; font-size: 0.95rem; color: #64748b; margin-bottom: 32px; }
.form-label { color: #475569; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; margin-left: 4px; }
.form-control { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; font-size: 1rem; color: #1e293b; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.form-control::placeholder { color: #94a3b8; }
.form-control:focus { background: #ffffff; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); color: #0f172a; outline: none; }
.btn-primary { background: #0f172a; color: #ffffff; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: 10px; }
.btn-primary:hover { background: #1e293b; transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2); }
.back-link { color: #64748b; font-size: 0.875rem; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: color 0.2s; margin-top: 24px; }
.back-link:hover { color: #3b82f6; }
.alert { border-radius: 12px; font-size: 0.875rem; padding: 12px; margin-top: 20px; border: none; }
.alert-success { background: #f0fdf4; color: #166534; }
.alert-danger { background: #fef2f2; color: #991b1b; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="login-container">
  <div class="login-card">
    <div style="border-radius: 12px; overflow: hidden; margin-bottom: 20px;">
      <img th:src="@{/img/banner/bannerr.jpg}" src="/img/banner/bannerr.jpg" alt="IWPL Enterprise Banner" style="width: 100%; height: auto; display: block; border-radius: 12px;" />
    </div>
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to receive a reset link</p>

    <form th:action="@{/forgot-password}" method="post">
      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>

      <a th:href="@{/loginform}" class="back-link">
        <i class="bi bi-arrow-left"></i>
        Back to Login
      </a>
    </form>

    <div th:if="${message}" class="alert alert-success text-center">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${message}"></span>
    </div>
    
    <div th:if="${error}" class="alert alert-danger text-center">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${error}"></span>
    </div>
  </div>
</div>

</body>
</html>
