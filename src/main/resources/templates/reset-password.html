<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/> <!-- Optional, if you have a CSS file -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #ccc;
            width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 10px;
            color: green;
            text-align: center;
        }
        .error {
            margin-top: 10px;
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>

        <!-- Success message -->
        <div th:if="${message}" class="message" th:text="${message}"></div>

        <!-- Error message -->
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}" />
            
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter new password" />
            </div>
            
            <button type="submit">Reset Password</button>
            	<a th:href="@{/loginform}">Login</a>

        </form>
    </div>
</body>

<script th:if="${message != null}">
        Swal.fire({
            icon: 'success',
            title: 'Success',
            text: [[${message}]],
            confirmButtonText: 'OK'
        }).then(() => {
            window.location.href = '/loginform'; // redirect to login page after OK
        });
    </script>

    <script th:if="${error != null}">
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: [[${error}]],
            confirmButtonText: 'OK'
        });
    </script>
</html>
