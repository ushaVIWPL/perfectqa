<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{/main.css}">

<head>
    <title>Scenario Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
            margin: 0;
            padding: 20px;
        }

        form {
            background: #ffffff;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        form h2 {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #66afe9;
            outline: none;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <a th:href="@{/qaAdminMenuform}" class="back-btn">← Mainmenu</a>
    <a th:href="@{/api/transactions/scenarioss}" class="back-btn">📂 Scenario transaction list →</a>

    <h2>Add Scenario Transaction</h2>

    <form id="transactionForm">
        <input type="hidden" id="businessScenario" name="businessScenario" th:value="${transaction.businessScenario}" />

        <label>Business Scenario ID:</label>
        <input type="text" th:value="${transaction.businessScenario}" readonly />

        <label>Transaction Suffix:</label>
        <input type="text" id="transactionSuffix" name="transactionSuffix" />
        <div id="transactionSuffixError" class="error-message"></div>

        <label>Scenario Description:</label>
        <input type="text" id="scenarioDescription" name="scenarioDescription" />
        <div id="scenarioDescriptionError" class="error-message"></div>

        <label>Work Stream:</label>
        <input type="text" id="workStream" name="workStream" />

        <label>Activity:</label>
        <input type="text" id="activity" name="activity" />
        <div id="activityError" class="error-message"></div>

        <label>Responsible:</label>
        <input type="text" id="responsible" name="responsible" />

        <label>Expected Outcome:</label>
        <input type="text" id="expectedOutcome" name="expectedOutcome" />

        <label>T-Code:</label>
        <input type="text" id="tcode" name="tcode" />

        <button type="submit">Save</button>
    </form>

    <a th:href="@{/api/transactions/scenarioss}" class="btn btn-outline-success w-100">View Scenario Transactions</a>

    <script>
        const transactionSuffix = document.getElementById('transactionSuffix');
        const scenarioDescription = document.getElementById('scenarioDescription');
        const activity = document.getElementById('activity');

        const transactionSuffixError = document.getElementById('transactionSuffixError');
        const scenarioDescriptionError = document.getElementById('scenarioDescriptionError');
        const activityError = document.getElementById('activityError');

        function validateTransactionSuffix() {
            const value = transactionSuffix.value.trim();
            if (value === '') {
                transactionSuffixError.textContent = "Transaction Suffix is required.";
                transactionSuffix.style.borderColor = "red";
                return false;
            } else if (!/^\d{2}$/.test(value)) { // EXACTLY 2 digits
                transactionSuffixError.textContent = "Transaction Suffix must be exactly 2 digits.";
                transactionSuffix.style.borderColor = "red";
                return false;
            }
            transactionSuffixError.textContent = "";
            transactionSuffix.style.borderColor = "";
            return true;
        }

        function validateScenarioDescription() {
            if (scenarioDescription.value.trim() === '') {
                scenarioDescriptionError.textContent = "Scenario Description is required.";
                scenarioDescription.style.borderColor = "red";
                return false;
            }
            scenarioDescriptionError.textContent = "";
            scenarioDescription.style.borderColor = "";
            return true;
        }

        function validateActivity() {
            if (activity.value.trim() === '') {
                activityError.textContent = "Activity is required.";
                activity.style.borderColor = "red";
                return false;
            }
            activityError.textContent = "";
            activity.style.borderColor = "";
            return true;
        }

        // Immediate validation on blur
        transactionSuffix.addEventListener('blur', validateTransactionSuffix);
        scenarioDescription.addEventListener('blur', validateScenarioDescription);
        activity.addEventListener('blur', validateActivity);

        document.getElementById('transactionForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const isValidSuffix = validateTransactionSuffix();
            const isValidDescription = validateScenarioDescription();
            const isValidActivity = validateActivity();

            if (!isValidSuffix || !isValidDescription || !isValidActivity) return;

            const payload = {
                businessScenario: document.getElementById('businessScenario').value,
                transactionSuffix: transactionSuffix.value,
                scenarioDescription: scenarioDescription.value,
                workStream: document.getElementById('workStream').value,
                activity: activity.value,
                responsible: document.getElementById('responsible').value,
                expectedOutcome: document.getElementById('expectedOutcome').value,
                tcode: document.getElementById('tcode').value
            };

            fetch('/api/transactions/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(response => {
                if (response.ok) {
                    alert('Transaction saved successfully!');
                    window.location.href = "/api/transactions/scenarioss";
                } else {
                    response.text().then(msg => alert('Failed to save: ' + msg));
                }
            }).catch(error => {
                alert('Error: ' + error);
            });
        });
    </script>
</body>
</html>
