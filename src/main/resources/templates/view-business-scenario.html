<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Business Scenario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #f8fafc;
        }

        .container-fluid {
            padding-left: 2%;
            padding-right: 2%;
        }

        /* Header */
        .page-header {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        .page-header h2 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary { background: var(--primary-gradient); color: white; }
        .btn-secondary { background: var(--secondary-gradient); color: white; }
        .btn-success { background: var(--success-gradient); color: white; }
        .btn-warning { background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%); color: #333; }
        .btn-info { background: var(--info-gradient); color: white; }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        /* Details Card */
        .details-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .details-section {
            margin-bottom: 30px;
        }

        .details-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value {
            color: #333;
            word-wrap: break-word;
        }

        .detail-value.empty {
            color: #999;
            font-style: italic;
        }

        .scenario-badge {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            background: var(--primary-gradient);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            display: inline-block;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid #e0e0e0;
        }

        /* Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border-left: 5px solid #dc3545;
        }

        /* Back Button */
        .btn-nav {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .detail-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
        /* Enhanced Input Styles */
        .form-control[readonly] {
            border-radius: 8px !important;
            padding: 10px 15px !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            transition: all 0.3s ease !important;
            color: #f8fafc;
        }
        
        .form-control[readonly]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2) !important;
        }

        .form-control[readonly]:focus {
            outline: none !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2) !important;
        }

        textarea.form-control[readonly] {
            border-radius: 12px !important;
            resize: vertical !important;
        }
    </style>


<div class="container-fluid mt-4">

    
    <!-- Header -->
    <div class="page-header">
        <h2><i class="bi bi-eye"></i> View Business Scenario</h2>
    </div>

    <!-- Error Messages -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Details Card -->
    <div class="details-card" th:if="${scenario != null}">
        <!-- Basic Information -->
        <div class="details-section">
            <div class="section-title">
                <i class="bi bi-info-circle"></i>
                Basic Information
            </div>
            
            <div class="row g-4">
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-hash"></i> Business Scenario</label>
                    <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${scenario.id.businessScenario}">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-activity"></i> Activity</label>
                    <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${scenario.activity != null and !scenario.activity.isEmpty()} ? ${scenario.activity} : 'Not specified'">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-person"></i> Responsible</label>
                    <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${scenario.responsible != null and !scenario.responsible.isEmpty()} ? ${scenario.responsible} : 'Not specified'">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-layers"></i> Work Stream</label>
                    <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${scenario.workStream != null and !scenario.workStream.isEmpty()} ? ${scenario.workStream} : 'Not specified'">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-code-square"></i> T-Code</label>
                    <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${scenario.tcode != null and !scenario.tcode.isEmpty()} ? ${scenario.tcode} : 'Not specified'">
                </div>
            </div>
        </div>

        <!-- Description & Outcome -->
        <div class="details-section">
            <div class="section-title">
                <i class="bi bi-file-text"></i>
                Description & Outcome
            </div>
            
            <div class="row g-4">
                <div class="col-md-4">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-card-text"></i> Scenario Description</label>
                    <textarea class="form-control" rows="4" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:text="${scenario.scenarioDescription != null and !scenario.scenarioDescription.isEmpty()} ? ${scenario.scenarioDescription} : 'Not specified'"></textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted fw-bold"><i class="bi bi-bullseye"></i> Expected Outcome</label>
                    <textarea class="form-control" rows="4" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:text="${scenario.expectedOutcome != null and !scenario.expectedOutcome.isEmpty()} ? ${scenario.expectedOutcome} : 'Not specified'"></textarea>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <a th:if="${canAddEdit != null and canAddEdit}" 
               th:href="@{|/editbusinessscenario/${scenario.id.businessScenario}|}" 
               class="btn btn-warning">
                <i class="bi bi-pencil"></i> Edit Scenario
            </a>
            <a th:if="${canAddEdit != null and canAddEdit}"
               th:href="@{/addactivity(companyCode=${scenario.id.companyCode}, businessScenario=${scenario.id.businessScenario})}"
               class="btn btn-info">
                <i class="bi bi-plus-lg"></i> Add Activity
            </a>
        </div>
    </div>
</div>

</body>
</html>
