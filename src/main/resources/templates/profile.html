<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile | PerfectQA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<style>
        :root { --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --accent-purple: #a78bfa; --accent-blue: #60a5fa; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f8fafc; margin: 0; padding: 0; }
        .main-page-content { padding: 40px 20px; }

        .profile-container {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 45px; max-width: 700px; margin: 0 auto;
            backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .profile-header { text-align: center; margin-bottom: 35px; }
        .profile-header h3 {
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.8rem;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .profile-header p { color: #94a3b8; }

        .profile-pic {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 3px solid var(--accent-purple); margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.2);
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px; padding: 15px 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-label { font-weight: 600; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-size: 1rem; color: #f8fafc; }

        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 30px 0; }

        .section-title {
            font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--accent-purple);
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.04) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important; border-radius: 10px !important; padding: 12px 15px !important;
        }
        .form-control:focus { border-color: var(--accent-purple) !important; box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1) !important; }
        .form-control::placeholder { color: #64748b !important; }
        .form-label { color: #94a3b8 !important; font-weight: 600; font-size: 0.85rem; }

        .strength-bar-track { height: 5px; background: rgba(255,255,255,0.05); border-radius: 5px; margin-top: 8px; }

        .btn-premium { padding: 12px 24px; border-radius: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: all 0.3s; border: none; cursor: pointer; }
        .btn-violet { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; width: 100%; justify-content: center; }
        .btn-glass { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: white; }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .btn-row { display: flex; gap: 12px; justify-content: center; margin-top: 30px; }
    </style>


<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/notificationScripts :: notificationScripts}"></div>

<div class="main-page-content">
    <div class="profile-container">

        <button onclick="history.back()" class="btn-premium btn-glass mb-4" style="font-size: 0.85rem; padding: 8px 16px;">
            <i class="bi bi-arrow-left"></i> Back
        </button>

        <div class="profile-header">
            <img th:src="${session.profilePic != null ? '/uploads/' + session.profilePic : '/default-avatar.png'}"
                 class="profile-pic" alt="Profile Picture">
            <h3>User Profile</h3>
            <p>Your account information</p>
        </div>

        <div class="detail-box">
            <div class="info-label">Full Name</div>
            <div class="info-value" th:text="${session.username}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Email Address</div>
            <div class="info-value" th:text="${session.email}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Phone Number</div>
            <div class="info-value" th:text="${session.phone}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Company Name</div>
            <div class="info-value" th:text="${session.companyName}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Company Code</div>
            <div class="info-value" th:text="${session.companyCode}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Department</div>
            <div class="info-value" th:text="${session.department != null && !#strings.isEmpty(session.department) ? session.department : 'N/A'}"></div>
        </div>
        <div class="detail-box">
            <div class="info-label">Role</div>
            <div class="info-value" th:text="${session.role}"></div>
        </div>

        <hr class="divider">

        <div class="section-title"><i class="bi bi-key"></i> Change Password</div>

        <form id="changePasswordForm">
            <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" name="currentPassword" placeholder="Enter current password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="newPassword" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
                <div class="strength-bar-track">
                    <div id="strengthBar" style="height: 100%; width: 0; border-radius: 5px; transition: all 0.3s;"></div>
                </div>
                <small id="strengthText" class="text-muted"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm new password" required>
            </div>
            <button type="submit" class="btn-premium btn-violet">
                <i class="bi bi-check-lg"></i> Change Password
            </button>
        </form>

        <div class="btn-row">
            <a th:href="@{/settings}" class="btn-premium btn-glass"><i class="bi bi-gear"></i> Settings</a>
            <a th:href="@{/Menu}" class="btn-premium btn-glass"><i class="bi bi-house"></i> Dashboard</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('newPassword').addEventListener('input', function() {
    const password = this.value;
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    let strength = 0;
    if (password.length >= 6) strength++;
    if (password.length >= 8) strength++;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
    if (/\d/.test(password)) strength++;
    if (/[^a-zA-Z0-9]/.test(password)) strength++;
    if (password.length === 0) { bar.style.width = '0'; text.textContent = ''; }
    else if (strength <= 2) { bar.style.width = '33%'; bar.style.background = '#f87171'; text.textContent = 'Weak'; text.style.color = '#f87171'; }
    else if (strength <= 3) { bar.style.width = '66%'; bar.style.background = '#fbbf24'; text.textContent = 'Medium'; text.style.color = '#fbbf24'; }
    else { bar.style.width = '100%'; bar.style.background = '#34d399'; text.textContent = 'Strong'; text.style.color = '#34d399'; }
});

document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const currentPass = this.querySelector('input[name="currentPassword"]').value;
    const newPass = this.querySelector('input[name="newPassword"]').value;
    const confirmPass = this.querySelector('input[name="confirmPassword"]').value;
    if (!currentPass) { Swal.fire('Error', 'Please enter your current password', 'error'); return; }
    if (!newPass || newPass.length < 6) { Swal.fire('Error', 'New password must be at least 6 characters', 'error'); return; }
    if (newPass !== confirmPass) { Swal.fire('Error', 'New passwords do not match!', 'error'); return; }
    Swal.fire({ title: 'Changing Password...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    fetch('/api/users/change-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword: currentPass, newPassword: newPass, confirmPassword: confirmPass })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            Swal.fire({ icon: 'success', title: 'Password Changed!', text: data.message, timer: 3000, showConfirmButton: false });
            document.getElementById('changePasswordForm').reset();
            document.getElementById('strengthBar').style.width = '0';
            document.getElementById('strengthText').textContent = '';
        } else { Swal.fire('Error', data.message, 'error'); }
    })
    .catch(() => Swal.fire('Error', 'Failed to change password.', 'error'));
});
</script>
</body>
</html>
