<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <title>View Scenario Activity | PerfectQA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #f8fafc;
        }

        .main-page-content {
            padding: 40px 20px;
        }

        .container-fluid {
            padding-left: 2%;
            padding-right: 2%;
        }

        /* Header */
        .page-header {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 40px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-header h2 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: #94a3b8;
            margin: 5px 0 0;
        }

        /* Details Card */
        .details-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .details-section {
            margin-bottom: 30px;
        }

        .details-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-purple);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .detail-value {
            color: #f8fafc;
            word-wrap: break-word;
        }

        .detail-value.empty {
            color: #64748b;
            font-style: italic;
        }

        .badge {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-block;
        }

        .transaction-key-badge {
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .suffix-badge {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        /* Buttons */
        .btn-premium {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-violet { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: white; }
        .btn-glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .btn-green { background: linear-gradient(135deg, #059669, #34d399); color: white; }
        .btn-amber { background: linear-gradient(135deg, #d97706, #fbbf24); color: white; }
        .btn-blue { background: linear-gradient(135deg, #2563eb, #60a5fa); color: white; }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .nav-header {
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .detail-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            .btn-premium {
                width: 100%;
                justify-content: center;
            }
        }
        /* Enhanced Input Styles */
        .form-control[readonly] {
            border-radius: 8px !important;
            padding: 10px 15px !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            transition: all 0.3s ease !important;
            color: #f8fafc;
        }
        
        .form-control[readonly]:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2) !important;
        }

        .form-control[readonly]:focus {
            outline: none !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2) !important;
        }

        textarea.form-control[readonly] {
            border-radius: 12px !important;
            resize: vertical !important;
        }
    </style>

    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="main-page-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h2><i class="bi bi-eye"></i> View Scenario Activity / EPIC</h2>
                    <p style="margin-bottom: 0;">Complete execution details for the selected activity</p>
                </div>
                <div>
                    <button type="button" class="btn-premium" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); text-shadow: 0 1px 2px rgba(0,0,0,0.2);" data-bs-toggle="modal" data-bs-target="#hierarchyModal">
                        <i class="bi bi-diagram-3"></i> View Business Scenario
                    </button>
                </div>
            </div>

            <!-- Error Messages -->
            <div th:if="${error}" class="alert alert-danger mb-4" style="background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; padding: 15px 20px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Details Card -->
            <div class="details-card" th:if="${activity != null}">
                <!-- Identification & Context Information -->
                <div class="details-section">
                    <div class="section-title">
                        <i class="bi bi-info-circle"></i>
                        Identification & Context
                    </div>
                    
                    <div class="row g-4">
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-briefcase"></i> Business Scenario</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.id.businessScenarioId.businessScenario}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-hash"></i> Transaction Suffix</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #60a5fa; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.id.transactionSuffix}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-key"></i> Transaction Key</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #a78bfa; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${#strings.contains(activity.transactionKey, '-') ? #strings.substringAfter(activity.transactionKey, '-') : activity.transactionKey}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-list-task"></i> Activity</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.activity ?: 'Not specified'}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-code-square"></i> T-Code</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.tcode ?: 'Not specified'}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-person"></i> Responsible</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.responsible ?: 'Not specified'}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-layers"></i> Work Stream</label>
                            <input type="text" class="form-control" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:value="${activity.workStream ?: 'Not specified'}">
                        </div>
                    </div>
                </div>

                <!-- Activity Details -->
                <div class="details-section">
                    <div class="section-title">
                        <i class="bi bi-activity"></i>
                        Activity Details
                    </div>
                    
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-file-text"></i> Description</label>
                            <textarea class="form-control" rows="4" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:text="${activity.scenarioDescription ?: 'Not specified'}"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted fw-bold"><i class="bi bi-bullseye"></i> Expected Outcome</label>
                            <textarea class="form-control" rows="4" style="background: rgba(255,255,255,0.05); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1);" readonly th:text="${activity.expectedOutcome ?: 'Not specified'}"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex flex-wrap gap-3 mt-4 pt-4 border-top border-white border-opacity-10">
                    <a th:if="${canAddEdit != null and canAddEdit}" 
                       th:href="@{|/editactivity/${activity.transactionKey}|}" 
                       class="btn-premium btn-amber">
                        <i class="bi bi-pencil"></i> Edit Activity
                    </a>
                    <a th:if="${canAddEdit != null and canAddEdit}"
                       th:href="@{'/api/transactions/addtestcaseheader/' + ${activity.transactionKey} + '/' + ${activity.id.businessScenarioId.companyCode}}"
                       class="btn-premium btn-blue">
                        <i class="bi bi-plus-lg"></i> Add Test Case Header
                    </a>
                </div>
            </div>
        </div>
        </div>
    </div>

<!-- Hierarchy Modal -->
<div class="modal fade" id="hierarchyModal" tabindex="-1" aria-labelledby="hierarchyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;">
            <div class="modal-header border-bottom border-white border-opacity-10">
                <h5 class="modal-title" id="hierarchyModalLabel" style="color: #a78bfa; font-weight: 600;"><i class="bi bi-diagram-3"></i> Scenario Hierarchy</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row g-4 justify-content-center">
                    <!-- 1. Business Scenario -->
                    <div class="col-md-10" th:if="${activity != null and activity.id.businessScenarioId != null}">
                        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; height: 100%;">
                            <h5 style="color: #c084fc; border-bottom: 1px solid rgba(192, 132, 252, 0.3); padding-bottom: 10px; margin-bottom: 20px;">
                                <i class="bi bi-briefcase"></i> 1. Business Scenario
                            </h5>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO CODE</label>
                                <div th:text="${activity.id.businessScenarioId.businessScenario}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO ACTIVITY</label>
                                <div th:text="${activity.businessScenario != null ? activity.businessScenario.activity : 'Not specified'}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO T-CODE</label>
                                <div th:text="${activity.businessScenario != null ? activity.businessScenario.tcode : 'Not specified'}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO DESCRIPTION</label>
                                <div th:text="${activity.businessScenario != null ? activity.businessScenario.scenarioDescription : 'Not specified'}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO EXPECTED OUTCOME</label>
                                <div th:text="${activity.businessScenario != null ? activity.businessScenario.expectedOutcome : 'Not specified'}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label style="color: #94a3b8; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px;">BUSINESS SCENARIO RESPONSIBLE</label>
                                <div th:text="${activity.businessScenario != null ? activity.businessScenario.responsible : 'Not specified'}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top border-white border-opacity-10">
                <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: white;" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
    <!-- Bootstrap JS for Modals -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
