<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management - Business Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<style>
        body {
            background: #f4f6f9;
            font-family: "Segoe UI", Roboto, sans-serif;
        }
        .container {
            max-width: 1400px;
        }
        .header-section {
            background: #0d6efd;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .company-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-left: 15px;
        }
        table {
            border-radius: 10px;
            overflow: hidden;
        }
        thead th {
            background: #2c3e50 !important;
            color: #fff !important;
            white-space: nowrap;
        }
    </style>


<div class="container mt-4">
    <div class="header-section">
        <h3 class="mb-0">
            <i class="bi bi-people me-2"></i>User Management
            <span class="company-badge" th:if="${session.companyCode != null}">
                Company: <b th:text="${session.companyCode}"></b>
            </span>
        </h3>
        <p class="mb-0 mt-2">Manage users of your company</p>
    </div>

    <div class="d-flex justify-content-between mb-3 flex-wrap gap-3 align-items-center">
        <a th:href="@{/business-manager}" class="btn btn-secondary" onclick="if (typeof loadDashboard === 'function') { loadDashboard(); return false; }">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
        <div class="d-flex gap-2 align-items-center">
            <select class="form-select" style="width: auto;" onchange="filterUsersByDepartment(this.value)">
                <option value="ALL">🌐 All Departments</option>
                <option th:each="d : ${departments}"
                        th:value="${d.departmentName}"
                        th:text="${d.departmentName + ' (' + d.departmentCode + ')'}"
                        th:selected="${selectedDepartment == d.departmentName}"></option>
            </select>
            <a th:href="@{/register}" class="btn btn-success" onclick="if (document.getElementById('addUserModal')) { if (typeof loadModalDepartments === 'function') loadModalDepartments(); new bootstrap.Modal(document.getElementById('addUserModal')).show(); return false; }">
                <i class="bi bi-person-plus me-1"></i> Add New User
            </a>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role & Dept</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${users == null or users.empty}">
                            <td colspan="7" class="text-center text-muted">No users found.</td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.userId}"></td>
                            <td th:text="|${user.firstName != null ? user.firstName : ''} ${user.lastName != null ? user.lastName : ''}|"></td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span class="badge me-1" 
                                      th:classappend="${user.userRole == 'ADMIN'} ? 'bg-danger' : 
                                                      (${user.userRole == 'BUSINESS_MANAGER'} ? 'bg-primary' : 'bg-info')"
                                      th:text="${user.userRole}"></span>
                                <span class="badge bg-secondary" th:if="${user.department != null and !user.department.isEmpty()}" th:text="${user.department}"></span>
                            </td>
                            <td th:text="${user.phoneNo}"></td>
                            <td>
                                <div class="form-check form-switch d-inline-block">
                                    <input class="form-check-input status-toggle" type="checkbox" 
                                           th:id="'status-' + ${user.userId}"
                                           th:data-userid="${user.userId}"
                                           th:checked="${user.status == 1}"
                                           onchange="toggleUserStatus(this)"
                                           style="width: 3em; height: 1.5em; cursor: pointer;">
                                </div>
                                <span class="badge ms-2" 
                                      th:id="'badge-' + ${user.userId}"
                                      th:classappend="${user.status == 1} ? 'bg-success' : 'bg-warning'"
                                      th:text="${user.status == 1} ? 'Active' : 'Inactive'"></span>
                            </td>
                            <td>
                                <a th:href="@{|/edit-user/${user.userId}|}" 
                                   class="btn btn-sm btn-primary me-1" title="Edit User">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button class="btn btn-sm btn-outline-danger reset-password-btn" 
                                        th:data-email="${user.email}"
                                        title="Reset Password">
                                    <i class="bi bi-key"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    window.filterUsersByDepartment = function(dep) {
        const tbody = document.querySelector('table tbody');
        if (tbody) {
            const rows = Array.from(tbody.querySelectorAll('tr'));
            if (!dep || dep === 'ALL') {
                rows.forEach(r => r.style.display = '');
            } else {
                const cleanDep = dep.toLowerCase().trim();
                rows.forEach(r => {
                    const text = r.textContent.toLowerCase();
                    if (text.includes(cleanDep)) {
                        r.style.display = '';
                    } else {
                        r.style.display = 'none';
                    }
                });
            }
        }

        if (typeof loadContent === 'function') {
            loadContent('/business-manager/users?department=' + encodeURIComponent(dep));
        } else {
            window.location.href = '/business-manager/users?department=' + encodeURIComponent(dep);
        }
    };

    // Toggle user status
    function toggleUserStatus(checkbox) {
        const userId = checkbox.dataset.userid;
        const newStatus = checkbox.checked ? 1 : 0;
        const statusText = checkbox.checked ? 'Active' : 'Inactive';
        
        fetch('/api/users/toggle-status/' + encodeURIComponent(userId), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status: newStatus })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update badge
                const badge = document.getElementById('badge-' + userId);
                if (badge) {
                    badge.className = 'badge ms-2 ' + (newStatus === 1 ? 'bg-success' : 'bg-warning');
                    badge.textContent = statusText;
                }
                
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'User status updated to ' + statusText,
                    showConfirmButton: false,
                    timer: 2000
                });
            } else {
                // Revert checkbox
                checkbox.checked = !checkbox.checked;
                Swal.fire('Error', data.message || 'Failed to update status', 'error');
            }
        })
        .catch(error => {
            // Revert checkbox
            checkbox.checked = !checkbox.checked;
            Swal.fire('Error', 'Failed to update status', 'error');
        });
    }
    
    // Reset password
    function resetPassword(email) {
        Swal.fire({
            title: 'Reset Password?',
            text: 'A new password will be generated and sent to ' + email,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Yes, reset it!'
        }).then((result) => {
            if (result.isConfirmed) {
                fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        Swal.fire('Success', 'New password has been sent to ' + email, 'success');
                    } else {
                        Swal.fire('Error', data.message || 'Failed to reset password', 'error');
                    }
                })
                .catch(error => {
                    Swal.fire('Error', 'Failed to reset password', 'error');
                });
            }
        });
    
    function initUsers() {
        document.querySelectorAll('.reset-password-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const email = this.getAttribute('data-email');
                if (email) {
                    resetPassword(email);
                }
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUsers);
    } else {
        initUsers();
    }
</script>
</body>
</html>
