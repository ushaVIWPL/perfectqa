<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scrum Board | PerfectQA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

<style>
    :root {
        --bg-deep: #020617;
        --glass-bg: rgba(30, 41, 59, 0.4);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent-purple: #a78bfa;
        --accent-blue: #3b82f6;
        --accent-green: #10b981;
        --accent-red: #f43f5e;
        --accent-amber: #f59e0b;
        --text-bright: #f8fafc;
        --text-dim: #94a3b8;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-deep);
        background: radial-gradient(circle at top right, #1e1b4b 0%, #020617 100%);
        min-height: 100vh;
        color: var(--text-bright);
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    .main-content {
        padding: 40px 30px;
    }

    .board-header {
        max-width: 1600px;
        margin: 0 auto 40px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 30px 45px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .header-title h2 {
        font-family: 'Outfit', sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        margin: 0;
        background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
    }

    .scrum-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        max-width: 1600px;
        margin: 0 auto;
        min-height: 75vh;
    }

    .board-column {
        background: rgba(30, 41, 59, 0.2);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        padding: 20px;
        backdrop-filter: blur(10px);
        transition: all 0.3s;
    }

    .column-header {
        padding: 5px 5px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 0.9rem;
    }

    .column-title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .column-count {
        background: rgba(255,255,255,0.05);
        padding: 4px 12px;
        border-radius: 50px;
        font-size: 0.75rem;
        color: var(--text-dim);
        border: 1px solid var(--glass-border);
    }

    .task-list {
        flex: 1;
        min-height: 200px;
        padding: 2px;
    }

    .task-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 16px;
        cursor: grab;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    .task-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 4px; height: 100%;
        background: var(--accent-blue);
        opacity: 0.5;
    }

    .task-card:active { cursor: grabbing; }

    .task-card:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        transform: translateY(-5px);
    }

    .task-card:hover::before { opacity: 1; width: 6px; }

    .task-id {
        font-size: 0.75rem;
        color: var(--accent-blue);
        font-weight: 800;
        margin-bottom: 10px;
        display: block;
        letter-spacing: 0.5px;
    }

    .task-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 15px;
        color: #f1f5f9;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .task-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .priority-badge {
        font-size: 0.65rem;
        padding: 3px 10px;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .priority-high { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid rgba(244, 63, 94, 0.2); }
    .priority-medium { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.2); }
    .priority-low { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.2); }

    .assignee-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .assignee-initials {
        width: 28px;
        height: 28px;
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 800;
        border: 2px solid rgba(255,255,255,0.1);
    }

    .btn-create {
        padding: 10px 24px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        color: white;
        text-decoration: none;
        transition: all 0.3s;
        border: none;
    }

    .btn-create:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        color: white;
    }

    .empty-state {
        padding: 30px 10px;
        text-align: center;
        color: var(--text-dim);
        font-size: 0.85rem;
        font-style: italic;
        opacity: 0.5;
    }

    /* Column Specific Accents */
    #OPEN-col::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-blue); border-radius: 24px 24px 0 0; }
    #IN_PROGRESS-col::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-amber); border-radius: 24px 24px 0 0; }
    #ON_HOLD-col::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-red); border-radius: 24px 24px 0 0; }
    #RESOLVED-col::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-green); border-radius: 24px 24px 0 0; }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-up { animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    /* Drag states */
    .sortable-ghost { opacity: 0.2; transform: scale(0.95); }
    .sortable-chosen { background: rgba(255, 255, 255, 0.08); }

    .dropdown-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--glass-border);
        color: var(--text-bright);
        border-radius: 14px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.3s;
    }
    .dropdown-btn:hover { background: rgba(255,255,255,0.1); }
</style>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content">
    <div class="board-header animate-up">
        <div class="header-title">
            <h2 th:text="${boardTitle}">QA Kanban Board</h2>
            <p class="small m-0 mt-1" style="color: #94a3b8; font-size: 0.95rem; font-weight: 500;">Visualize workflow and track ticket progress across stages.</p>
        </div>
        <div class="d-flex gap-3 align-items-center">
            <div class="dropdown">
                <button class="dropdown-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="bi bi-funnel me-2"></i> <span th:text="${issueType == 'IT_SUPPORT' ? 'Support' : 'Standard'}">Filter</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-dark border-secondary">
                    <li><a class="dropdown-item py-2" th:href="@{/api/tickets/board}"><i class="bi bi-ticket-perforated me-2"></i> Standard Tickets</a></li>
                    <li><a class="dropdown-item py-2" th:href="@{/api/tickets/board(issueType='IT_SUPPORT')}"><i class="bi bi-headset me-2"></i> Tasks</a></li>
                </ul>
            </div>
            <a th:href="@{/api/tickets/createticket}" class="btn-create">
                <i class="bi bi-plus-lg"></i> New Ticket
            </a>
        </div>
    </div>

    <div class="scrum-container">
        <!-- To Do Column -->
        <div class="board-column animate-up" id="OPEN-col" style="animation-delay: 0.1s">
            <div class="column-header">
                <div class="column-title-wrap">
                    <i class="bi bi-circle-fill" style="color: var(--accent-blue); font-size: 0.6rem;"></i>
                    <span>To Do</span>
                </div>
                <span class="column-count" th:text="${#lists.size(openTickets)}">0</span>
            </div>
            <div class="task-list" id="OPEN" data-status="OPEN">
                <div th:each="ticket : ${openTickets}" class="task-card" th:data-id="${ticket.id}" 
                     th:style="'border-left: 4px solid ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'var(--accent-red)' : (ticket.priority == 'MEDIUM' ? 'var(--accent-amber)' : 'var(--accent-blue)')})">
                    <span class="task-id" th:text="${ticket.ticketNo}"></span>
                    <div class="task-title" th:text="${ticket.issueDescription}"></div>
                    <div class="task-meta">
                        <span th:class="'priority-badge ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'priority-high' : (ticket.priority == 'MEDIUM' ? 'priority-medium' : 'priority-low')})" 
                              th:text="${ticket.priority}">MEDIUM</span>
                        <div class="assignee-wrap">
                            <div class="assignee-initials" th:title="${ticket.assigneeName ?: 'Unassigned'}" 
                                 th:text="${ticket.assigneeName != null and !ticket.assigneeName.isEmpty() ? #strings.substring(ticket.assigneeName, 0, 1) : '?'}"></div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(openTickets)}" class="empty-state">No tickets in backlog</div>
            </div>
        </div>

        <!-- In Progress Column -->
        <div class="board-column animate-up" id="IN_PROGRESS-col" style="animation-delay: 0.2s">
            <div class="column-header">
                <div class="column-title-wrap">
                    <i class="bi bi-circle-fill" style="color: var(--accent-amber); font-size: 0.6rem;"></i>
                    <span>In Progress</span>
                </div>
                <span class="column-count" th:text="${#lists.size(inProgressTickets)}">0</span>
            </div>
            <div class="task-list" id="IN_PROGRESS" data-status="IN_PROGRESS">
                <div th:each="ticket : ${inProgressTickets}" class="task-card" th:data-id="${ticket.id}"
                     th:style="'border-left: 4px solid ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'var(--accent-red)' : (ticket.priority == 'MEDIUM' ? 'var(--accent-amber)' : 'var(--accent-blue)')})">
                    <span class="task-id" th:text="${ticket.ticketNo}"></span>
                    <div class="task-title" th:text="${ticket.issueDescription}"></div>
                    <div class="task-meta">
                        <span th:class="'priority-badge ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'priority-high' : (ticket.priority == 'MEDIUM' ? 'priority-medium' : 'priority-low')})" 
                              th:text="${ticket.priority}">MEDIUM</span>
                        <div class="assignee-wrap">
                            <div class="assignee-initials" th:title="${ticket.assigneeName ?: 'Unassigned'}" 
                                 th:text="${ticket.assigneeName != null and !ticket.assigneeName.isEmpty() ? #strings.substring(ticket.assigneeName, 0, 1) : '?'}"></div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(inProgressTickets)}" class="empty-state">No active tasks</div>
            </div>
        </div>

        <!-- On Hold Column -->
        <div class="board-column animate-up" id="ON_HOLD-col" style="animation-delay: 0.3s">
            <div class="column-header">
                <div class="column-title-wrap">
                    <i class="bi bi-circle-fill" style="color: var(--accent-red); font-size: 0.6rem;"></i>
                    <span>On Hold</span>
                </div>
                <span class="column-count" th:text="${#lists.size(onHoldTickets)}">0</span>
            </div>
            <div class="task-list" id="ON_HOLD" data-status="ON_HOLD">
                <div th:each="ticket : ${onHoldTickets}" class="task-card" th:data-id="${ticket.id}"
                     th:style="'border-left: 4px solid ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'var(--accent-red)' : (ticket.priority == 'MEDIUM' ? 'var(--accent-amber)' : 'var(--accent-blue)')})">
                    <span class="task-id" th:text="${ticket.ticketNo}"></span>
                    <div class="task-title" th:text="${ticket.issueDescription}"></div>
                    <div class="task-meta">
                        <span th:class="'priority-badge ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'priority-high' : (ticket.priority == 'MEDIUM' ? 'priority-medium' : 'priority-low')})" 
                              th:text="${ticket.priority}">MEDIUM</span>
                        <div class="assignee-wrap">
                            <div class="assignee-initials" th:title="${ticket.assigneeName ?: 'Unassigned'}" 
                                  th:text="${ticket.assigneeName != null and !ticket.assigneeName.isEmpty() ? #strings.substring(ticket.assigneeName, 0, 1) : '?'}"></div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(onHoldTickets)}" class="empty-state">No on hold tickets</div>
            </div>
        </div>

        <!-- Resolved Column -->
        <div class="board-column animate-up" id="RESOLVED-col" style="animation-delay: 0.4s">
            <div class="column-header">
                <div class="column-title-wrap">
                    <i class="bi bi-circle-fill" style="color: var(--accent-green); font-size: 0.6rem;"></i>
                    <span>Resolved</span>
                </div>
                <span class="column-count" th:text="${#lists.size(resolvedTickets)}">0</span>
            </div>
            <div class="task-list" id="RESOLVED" data-status="RESOLVED">
                <div th:each="ticket : ${resolvedTickets}" class="task-card" th:data-id="${ticket.id}"
                     th:style="'border-left: 4px solid ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'var(--accent-red)' : (ticket.priority == 'MEDIUM' ? 'var(--accent-amber)' : 'var(--accent-blue)')})">
                    <span class="task-id" th:text="${ticket.ticketNo}"></span>
                    <div class="task-title" th:text="${ticket.issueDescription}"></div>
                    <div class="task-meta">
                        <span th:class="'priority-badge ' + (${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'priority-high' : (ticket.priority == 'MEDIUM' ? 'priority-medium' : 'priority-low')})" 
                              th:text="${ticket.priority}">MEDIUM</span>
                        <div class="assignee-wrap">
                            <div class="assignee-initials" th:title="${ticket.assigneeName ?: 'Unassigned'}" 
                                  th:text="${ticket.assigneeName != null and !ticket.assigneeName.isEmpty() ? #strings.substring(ticket.assigneeName, 0, 1) : '?'}"></div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(resolvedTickets)}" class="empty-state">No resolved tickets</div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const columns = ['OPEN', 'IN_PROGRESS', 'ON_HOLD', 'RESOLVED'];
        
        columns.forEach(id => {
            const el = document.getElementById(id);
            Sortable.create(el, {
                group: 'scrum-board',
                animation: 250,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                onEnd: function(evt) {
                    const ticketId = evt.item.getAttribute('data-id');
                    const newStatus = evt.to.getAttribute('data-status');
                    
                    if (evt.from !== evt.to) {
                        updateTicketStatus(ticketId, newStatus);
                        updateColumnCounts();
                        
                        // Hide/show empty state
                        toggleEmptyStates();
                    }
                }
            });
        });

        function updateTicketStatus(ticketId, status) {
            const formData = new FormData();
            formData.append('ticketId', ticketId);
            formData.append('status', status);

            fetch('/api/tickets/update-status-hx', {
                method: 'POST',
                body: formData
            }).then(response => {
                if (!response.ok) {
                    console.error('Failed to update status');
                }
            }).catch(error => {
                console.error('Error:', error);
            });
        }

        function updateColumnCounts() {
            columns.forEach(id => {
                const el = document.getElementById(id);
                const count = Array.from(el.children).filter(c => c.classList.contains('task-card')).length;
                const header = el.closest('.board-column').querySelector('.column-count');
                header.textContent = count;
            });
        }

        function toggleEmptyStates() {
            columns.forEach(id => {
                const el = document.getElementById(id);
                const cards = el.querySelectorAll('.task-card');
                let emptyMsg = el.querySelector('.empty-state');
                
                if (cards.length === 0 && !emptyMsg) {
                    const msg = document.createElement('div');
                    msg.className = 'empty-state';
                    msg.textContent = 'No tasks in this stage';
                    el.appendChild(msg);
                } else if (cards.length > 0 && emptyMsg) {
                    emptyMsg.remove();
                }
            });
        }

        // Add double click to view ticket details
        document.addEventListener('dblclick', function(e) {
            const card = e.target.closest('.task-card');
            if (card) {
                const id = card.getAttribute('data-id');
                window.location.href = '/api/tickets/view/' + id;
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
